<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS — Charts</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #080b0f;
    --surface: #0d1117;
    --border:  #21262d;
    --accent:  #f0b429;
    --green:   #3fb950;
    --red:     #f85149;
    --cyan:    #58a6ff;
    --text:    #c9d1d9;
    --dim:     #6e7681;
    --mono:    'JetBrains Mono', monospace;
    --disp:    'Bebas Neue', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--mono); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  header {
    display:flex; align-items:center; gap:16px;
    padding:8px 20px; background:var(--surface);
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .logo { font-family:var(--disp); font-size:24px; letter-spacing:3px; color:var(--accent); line-height:1; }
  .logo small { display:block; font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:1px; }

  .tabs { display:flex; gap:4px; }
  .tab {
    padding:5px 14px; border:1px solid var(--border); background:transparent;
    color:var(--dim); font-family:var(--mono); font-size:12px; font-weight:600;
    cursor:pointer; border-radius:4px; transition:all 0.15s; letter-spacing:1px;
  }
  .tab:hover { border-color:var(--accent); color:var(--text); }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#000; }

  .price-box { margin-left:auto; display:flex; align-items:baseline; gap:8px; }
  .pval { font-size:22px; font-weight:700; }
  .pchg { font-size:12px; font-weight:600; }
  .up { color:var(--green); } .dn { color:var(--red); }

  .toolbar {
    display:flex; align-items:center; gap:8px;
    padding:6px 20px; background:var(--surface);
    border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap;
  }
  .tg { display:flex; align-items:center; gap:5px; padding-right:10px; border-right:1px solid var(--border); }
  .tg:last-child { border-right:none; margin-left:auto; }
  .tlbl { font-size:9px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }

  .btn {
    padding:3px 9px; border:1px solid var(--border); background:transparent;
    font-family:var(--mono); font-size:11px; font-weight:600;
    cursor:pointer; border-radius:3px; transition:all 0.15s; color:var(--dim);
  }
  .btn:hover { border-color:var(--cyan); color:var(--cyan); }
  .btn.s20  { color:#f0b429; border-color:#f0b429; }
  .btn.s40  { color:#e05c1a; border-color:#e05c1a; }
  .btn.s100 { color:#58a6ff; border-color:#58a6ff; }
  .btn.s200 { color:#bc8cff; border-color:#bc8cff; }
  .btn.on.s20  { background:#f0b429; color:#000; }
  .btn.on.s40  { background:#e05c1a; color:#fff; }
  .btn.on.s100 { background:#58a6ff; color:#000; }
  .btn.on.s200 { background:#bc8cff; color:#000; }
  .btn.off { opacity:0.3; }
  .btn.draw-on { border-color:var(--cyan); color:var(--cyan); background:rgba(88,166,255,0.1); }
  .btn.danger:hover { border-color:var(--red); color:var(--red); }

  #info { font-size:11px; color:var(--dim); }

  .chart-wrap { flex:1; position:relative; overflow:hidden; }
  canvas { position:absolute; top:0; left:0; }
  #chartCanvas { cursor:default; }
  #drawCanvas  { pointer-events:none; z-index:5; }
  #drawCanvas.draw-mode { pointer-events:all; cursor:crosshair; }

  /* Tooltip */
  #tooltip {
    position:absolute; display:none;
    background:#0d1117; border:1px solid #21262d;
    border-radius:5px; padding:8px 12px;
    font-size:11px; pointer-events:none; z-index:20;
    min-width:190px;
  }
  #tooltip .tt-title { color:var(--accent); font-weight:700; margin-bottom:5px; font-size:11px; }
  #tooltip .tt-row   { display:flex; justify-content:space-between; gap:14px; }
  #tooltip .tt-lbl   { color:var(--dim); }
  #tooltip .tt-val   { color:var(--text); font-weight:600; }

  .toast {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#161b22; border:1px solid var(--border); color:var(--text);
    padding:7px 18px; border-radius:6px; font-size:12px;
    z-index:100; opacity:0; transition:opacity 0.3s; pointer-events:none;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <div class="logo">AXIS<small>CHARTS v1.1</small></div>
  <div class="tabs">
    <button class="tab on"  onclick="cambiar('SPY')">SPY</button>
    <button class="tab"     onclick="cambiar('AAPL')">AAPL</button>
    <button class="tab"     onclick="cambiar('BA')">BA</button>
    <button class="tab"     onclick="cambiar('GLD')">GLD</button>
  </div>
  <div class="price-box">
    <span class="pval" id="pval">—</span>
    <span class="pchg" id="pchg"></span>
  </div>
</header>

<div class="toolbar">
  <div class="tg">
    <span class="tlbl">SMA</span>
    <button class="btn s20 on"  id="b20"  onclick="togSMA(20)">20</button>
    <button class="btn s40 on"  id="b40"  onclick="togSMA(40)">40</button>
    <button class="btn s100 on" id="b100" onclick="togSMA(100)">100</button>
    <button class="btn s200 on" id="b200" onclick="togSMA(200)">200</button>
  </div>
  <div class="tg">
    <span class="tlbl">Vista</span>
    <button class="btn" onclick="fitChart()">⊡ Fit</button>
  </div>
  <div class="tg">
    <span class="tlbl">Dibujo</span>
    <button class="btn" id="bdraw" onclick="togDraw()">✏ Línea</button>
    <button class="btn danger" onclick="clearLines()">✕ Limpiar</button>
  </div>
  <div class="tg"><span id="info">Cargando...</span></div>
</div>

<div class="chart-wrap" id="wrap">
  <canvas id="chartCanvas"></canvas>
  <canvas id="drawCanvas"></canvas>
  <div id="tooltip">
    <div class="tt-title" id="tt-title"></div>
    <div class="tt-row"><span class="tt-lbl">Open</span><span class="tt-val" id="tt-o"></span></div>
    <div class="tt-row"><span class="tt-lbl">High</span><span class="tt-val" id="tt-h"></span></div>
    <div class="tt-row"><span class="tt-lbl">Low</span> <span class="tt-val" id="tt-l"></span></div>
    <div class="tt-row"><span class="tt-lbl">Close</span><span class="tt-val" id="tt-c" style="color:var(--green)"></span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const RAILWAY = 'https://web-production-bf9d0.up.railway.app';

// Colores
const C = {
  up:'#3fb950', dn:'#f85149', wick:'#484f58',
  sma:{ 20:'#f0b429', 40:'#e05c1a', 100:'#58a6ff', 200:'#bc8cff' },
  grid:'rgba(255,255,255,0.05)', gridH:'rgba(255,255,255,0.08)',
  dayLine:'rgba(240,180,41,0.3)', dayLabel:'#484f58',
  forming:'rgba(88,166,255,0.6)',
};

// Estado
let activo    = 'SPY';
let allVelas  = [];
let smaState  = { 20:true, 40:true, 100:true, 200:true };
let drawMode  = false, drawing = false, p0 = null;
let userLines = {};
let zoomStart = 0, zoomEnd = 0;
let panActive = false, panX0 = null, panZ0 = null;
let refreshTimer = null;
let hoveredIdx = -1;

// Canvas
const wrap = document.getElementById('wrap');
const cc   = document.getElementById('chartCanvas');
const dc   = document.getElementById('drawCanvas');
const ctx  = cc.getContext('2d');
const dctx = dc.getContext('2d');

// Márgenes del área de gráfica
const M = { top:30, right:70, bottom:30, left:10 };

// ═══════════════════════════════════════
// UTILIDADES
// ═══════════════════════════════════════
function esMercadoAbierto() {
  const est  = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const d = est.getDay(), h = est.getHours(), m = est.getMinutes();
  const mins = h*60+m;
  return d>=1 && d<=5 && mins>=570 && mins<961; // 9:30-16:01 EST
}

function velaLabel(tsMs) {
  const h = parseInt(new Date(tsMs).toLocaleString('en-US',{hour:'numeric',hour12:false,timeZone:'America/New_York'}));
  const m = new Date(tsMs).getMinutes();
  if (h===9 && m===30) return 'V1 · 9:30 EST';
  return ({10:'V1',11:'V2',12:'V3',13:'V4',14:'V5',15:'V6',16:'V7'}[h]||'V?') + ' · ' + h + ':00 EST';
}

function fmtFecha(tsMs) {
  return new Date(tsMs).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'America/New_York'});
}

function fmtDia(tsMs) {
  return new Date(tsMs).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/New_York'});
}

function calcSMA(velas, period) {
  return velas.map((v,i) => {
    if (i < period-1) return null;
    return velas.slice(i-period+1,i+1).reduce((s,c)=>s+c.c,0)/period;
  });
}

// ═══════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  cc.width = w; cc.height = h;
  dc.width = w; dc.height = h;
  render();
  redrawLines();
}

// ═══════════════════════════════════════
// CARGAR DATOS — Tradier 15min via Railway
// ═══════════════════════════════════════
async function cargarDatos(sym, silencioso=false) {
  if (!silencioso) document.getElementById('info').textContent = `Cargando ${sym}...`;
  try {
    // Llamamos a Railway que ya tiene get_velas() con Tradier 15min
    const url = `${RAILWAY}/velas?simbolo=${sym}&dias=60`;
    const res  = await fetch(url);
    const data = await res.json();
    if (!data.velas || !data.velas.length) throw new Error(data.error||'Sin datos');

    // Convertir formato Railway → formato canvas
    // datetime: "2026-05-12 09:30:00" → timestamp EST
    const velas = data.velas.reverse().map(v => {
      const dt = new Date(v.datetime.replace(' ','T') + '-04:00');
      return {
        x: dt.getTime(),
        o: parseFloat(v.open),
        h: parseFloat(v.high),
        l: parseFloat(v.low),
        c: parseFloat(v.close),
        vela: v.vela || '',
      };
    });

    allVelas = velas;
    if (!silencioso) { zoomStart=0; zoomEnd=velas.length-1; }
    else { zoomEnd=velas.length-1; zoomStart=Math.max(0,zoomEnd-(panZ0?.rango||zoomEnd)); }

    updatePrecio(velas);
    render();

    const desde = fmtFecha(velas[0].x);
    const auto  = esMercadoAbierto() ? ' · 🟢 auto 5min' : '';
    document.getElementById('info').textContent = `${velas.length} velas · desde ${desde}${auto} · Tradier`;

    clearTimeout(refreshTimer);
    if (esMercadoAbierto())
      refreshTimer = setTimeout(()=>cargarDatos(activo,true), 5*60*1000);

  } catch(e) {
    document.getElementById('info').textContent = 'Error: '+e.message;
    toast('Error: '+e.message);
  }
}

// ═══════════════════════════════════════
// RENDER PRINCIPAL
// ═══════════════════════════════════════
function render() {
  if (!allVelas.length) return;
  const W = cc.width, H = cc.height;
  const gW = W - M.left - M.right;
  const gH = H - M.top  - M.bottom;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#080b0f';
  ctx.fillRect(0,0,W,H);

  const visible = allVelas.slice(zoomStart, zoomEnd+1);
  if (!visible.length) return;

  // Rango de precios
  let minP = Infinity, maxP = -Infinity;
  visible.forEach(v => { if (v.l<minP) minP=v.l; if (v.h>maxP) maxP=v.h; });
  const pad = (maxP-minP)*0.05;
  minP -= pad; maxP += pad;

  // Funciones de conversión
  const xOf  = i  => M.left + (i/(visible.length-1||1)) * gW;
  const yOf  = p  => M.top  + (1-(p-minP)/(maxP-minP)) * gH;
  const velW = Math.max(1, Math.min(20, gW/visible.length*0.7));

  // ── Grid horizontal (precios) ──
  const pasos = 8;
  ctx.textAlign = 'left';
  for (let i=0; i<=pasos; i++) {
    const p  = minP + (maxP-minP)*i/pasos;
    const y  = yOf(p);
    ctx.beginPath();
    ctx.moveTo(M.left, y); ctx.lineTo(W-M.right, y);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#484f58';
    ctx.font = '10px JetBrains Mono';
    ctx.textAlign = 'left';
    ctx.fillText('$'+p.toFixed(2), W-M.right+6, y+4);
  }

  // ── Líneas verticales de inicio de día ──
  let fechaAnt = null;
  visible.forEach((v,i) => {
    const f = new Date(v.x).toLocaleDateString('en-US',{timeZone:'America/New_York'});
    if (f !== fechaAnt) {
      fechaAnt = f;
      const x = xOf(i);
      ctx.beginPath();
      ctx.moveTo(x, M.top); ctx.lineTo(x, H-M.bottom);
      ctx.strokeStyle = C.dayLine;
      ctx.lineWidth = 1; ctx.setLineDash([4,4]);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = C.dayLabel;
      ctx.font = '10px JetBrains Mono';
      ctx.textAlign = 'left';
      ctx.fillText(fmtDia(v.x), x+3, M.top+12);
    }
  });

  // ── SMAs ──
  [20,40,100,200].forEach(period => {
    if (!smaState[period]) return;
    const smas = calcSMA(allVelas, period).slice(zoomStart, zoomEnd+1);
    ctx.beginPath();
    let primero = true;
    smas.forEach((val,i) => {
      if (val===null) return;
      const x = xOf(i), y = yOf(val);
      if (primero) { ctx.moveTo(x,y); primero=false; }
      else ctx.lineTo(x,y);
    });
    ctx.strokeStyle = C.sma[period];
    ctx.lineWidth = 1; ctx.stroke();
  });

  // ── Velas ──
  visible.forEach((v,i) => {
    const x    = xOf(i);
    const yO   = yOf(v.o), yC = yOf(v.c);
    const yH   = yOf(v.h), yL = yOf(v.l);
    const sube = v.c >= v.o;
    const color = sube ? C.up : C.dn;
    const isHovered = i === hoveredIdx;

    // Mecha
    ctx.beginPath();
    ctx.moveTo(x, yH); ctx.lineTo(x, yL);
    ctx.strokeStyle = isHovered ? color : C.wick;
    ctx.lineWidth = 1; ctx.stroke();

    // Cuerpo
    const bodyY = Math.min(yO,yC);
    const bodyH = Math.max(1, Math.abs(yC-yO));
    ctx.fillStyle = isHovered ? color : (sube ? C.up+'99' : C.dn+'99');
    ctx.fillRect(x-velW/2, bodyY, velW, bodyH);
    if (isHovered) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.strokeRect(x-velW/2, bodyY, velW, bodyH);
    }
  });

  // ── Vela en formación ──
  if (esMercadoAbierto() && visible.length > 0) {
    const x = xOf(visible.length-1);
    ctx.beginPath();
    ctx.moveTo(x, M.top); ctx.lineTo(x, H-M.bottom);
    ctx.strokeStyle = C.forming;
    ctx.lineWidth = 1.5; ctx.setLineDash([3,3]);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#58a6ff';
    ctx.font = 'bold 10px JetBrains Mono';
    ctx.textAlign = 'center';
    ctx.fillText('EN FORMACIÓN', x, M.top+24);
  }

  // ── Eje X (fechas) ──
  ctx.fillStyle = '#484f58';
  ctx.font = '10px JetBrains Mono';
  ctx.textAlign = 'center';
  const paso = Math.ceil(visible.length/10);
  visible.forEach((v,i) => {
    if (i%paso!==0) return;
    ctx.fillText(fmtDia(v.x), xOf(i), H-M.bottom+16);
  });
}

// ═══════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════
function showTooltip(e) {
  if (!allVelas.length) return;
  const rect   = cc.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  const W = cc.width, H = cc.height;
  const gW = W - M.left - M.right;

  const visible = allVelas.slice(zoomStart, zoomEnd+1);
  const i = Math.round((mouseX - M.left) / gW * (visible.length-1));
  if (i<0||i>=visible.length) { hideTooltip(); return; }

  hoveredIdx = i;
  render();

  const v   = visible[i];
  const tt  = document.getElementById('tooltip');
  const sube = v.c >= v.o;

  document.getElementById('tt-title').textContent = fmtFecha(v.x) + '  ' + velaLabel(v.x);
  document.getElementById('tt-o').textContent = '$'+v.o.toFixed(2);
  document.getElementById('tt-h').textContent = '$'+v.h.toFixed(2);
  document.getElementById('tt-l').textContent = '$'+v.l.toFixed(2);
  const ttC = document.getElementById('tt-c');
  ttC.textContent = '$'+v.c.toFixed(2);
  ttC.style.color = sube ? '#3fb950' : '#f85149';

  // Posición del tooltip
  let tx = e.clientX - rect.left + 16;
  let ty = e.clientY - rect.top  - 10;
  if (tx + 200 > W) tx = mouseX - 210;
  if (ty + 120 > H) ty = H - 130;
  tt.style.left    = tx+'px';
  tt.style.top     = ty+'px';
  tt.style.display = 'block';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
  if (hoveredIdx !== -1) { hoveredIdx = -1; render(); }
}

// ═══════════════════════════════════════
// ZOOM
// ═══════════════════════════════════════
cc.addEventListener('wheel', e => {
  e.preventDefault();
  if (!allVelas.length) return;
  const total  = allVelas.length;
  const rango  = zoomEnd - zoomStart;
  const factor = e.deltaY < 0 ? 0.85 : 1.15;
  const newLen = Math.max(7, Math.min(total, Math.round(rango*factor)));
  const rect   = cc.getBoundingClientRect();
  const relX   = (e.clientX-rect.left) / cc.width;
  const centro = Math.round(zoomStart + rango*relX);
  zoomStart    = Math.max(0, centro - Math.round(newLen/2));
  zoomEnd      = Math.min(total-1, zoomStart+newLen);
  if (zoomEnd===total-1) zoomStart = Math.max(0,zoomEnd-newLen);
  render();
}, { passive:false });

// ═══════════════════════════════════════
// PAN
// ═══════════════════════════════════════
cc.addEventListener('mousedown', e => {
  if (drawMode) return;
  panActive = true;
  panX0     = e.clientX;
  panZ0     = { start:zoomStart, end:zoomEnd, rango:zoomEnd-zoomStart };
  cc.style.cursor = 'grabbing';
});

cc.addEventListener('mousemove', e => {
  if (panActive && panZ0) {
    const gW      = cc.width - M.left - M.right;
    const pxPorV  = gW / (panZ0.rango||1);
    const delta   = Math.round((e.clientX - panX0) / pxPorV);
    let ns        = panZ0.start - delta;
    let ne        = panZ0.end   - delta;
    const total   = allVelas.length;
    if (ns < 0)         { ne -= ns; ns = 0; }
    if (ne > total-1)   { ns -= (ne-(total-1)); ne = total-1; }
    zoomStart = Math.max(0, ns);
    zoomEnd   = Math.min(total-1, ne);
    render();
  } else if (!drawMode) {
    showTooltip(e);
  }
});

cc.addEventListener('mouseup', e => {
  panActive = false; panX0 = null;
  cc.style.cursor = 'default';
});

cc.addEventListener('mouseleave', () => {
  panActive = false;
  cc.style.cursor = 'default';
  hideTooltip();
});

// ═══════════════════════════════════════
// FIT
// ═══════════════════════════════════════
function fitChart() {
  zoomStart=0; zoomEnd=allVelas.length-1;
  render(); toast('Vista completa');
}

// ═══════════════════════════════════════
// SMA TOGGLE
// ═══════════════════════════════════════
function togSMA(p) {
  smaState[p] = !smaState[p];
  document.getElementById('b'+p).classList.toggle('on',  smaState[p]);
  document.getElementById('b'+p).classList.toggle('off', !smaState[p]);
  render();
}

// ═══════════════════════════════════════
// CAMBIAR ACTIVO
// ═══════════════════════════════════════
function cambiar(sym) {
  activo = sym;
  clearTimeout(refreshTimer);
  allVelas=[]; zoomStart=0; zoomEnd=0;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.textContent===sym));
  cargarDatos(sym);
}

// ═══════════════════════════════════════
// PRECIO HEADER
// ═══════════════════════════════════════
function updatePrecio(velas) {
  if (!velas.length) return;
  const last=velas[velas.length-1], prev=velas[velas.length-2];
  document.getElementById('pval').textContent = '$'+last.c.toFixed(2);
  if (prev) {
    const d=last.c-prev.c, pct=(d/prev.c*100).toFixed(2);
    const el=document.getElementById('pchg');
    el.textContent=(d>=0?'+':'')+d.toFixed(2)+' ('+pct+'%)';
    el.className='pchg '+(d>=0?'up':'dn');
  }
}

// ═══════════════════════════════════════
// DIBUJO DE LINEAS
// ═══════════════════════════════════════
function togDraw() {
  drawMode = !drawMode;
  dc.classList.toggle('draw-mode', drawMode);
  document.getElementById('bdraw').classList.toggle('draw-on', drawMode);
  // Deshabilitar tooltip y pan en modo dibujo
  toast(drawMode ? 'Modo dibujo ON — click y arrastra' : 'Modo dibujo OFF');
}

function clearLines() {
  userLines[activo]=[];
  dctx.clearRect(0,0,dc.width,dc.height);
  toast('Líneas eliminadas');
}

function redrawLines() {
  dctx.clearRect(0,0,dc.width,dc.height);
  (userLines[activo]||[]).forEach(l=>drawLine(l.x1,l.y1,l.x2,l.y2,false));
}

function drawLine(x1,y1,x2,y2,pre) {
  dctx.beginPath(); dctx.moveTo(x1,y1); dctx.lineTo(x2,y2);
  dctx.strokeStyle = pre?'rgba(88,166,255,0.5)':'#58a6ff';
  dctx.lineWidth   = pre?1:1.5;
  dctx.setLineDash(pre?[4,4]:[]);
  dctx.stroke(); dctx.setLineDash([]);
}

dc.addEventListener('mousedown', e=>{ if(!drawMode)return; drawing=true; p0={x:e.offsetX,y:e.offsetY}; });
dc.addEventListener('mousemove', e=>{ if(!drawMode||!drawing||!p0)return; redrawLines(); drawLine(p0.x,p0.y,e.offsetX,e.offsetY,true); });
dc.addEventListener('mouseup', e=>{
  if(!drawMode||!drawing||!p0)return; drawing=false;
  const dx=e.offsetX-p0.x, dy=e.offsetY-p0.y;
  if(Math.sqrt(dx*dx+dy*dy)<5)return;
  if(!userLines[activo])userLines[activo]=[];
  userLines[activo].push({x1:p0.x,y1:p0.y,x2:e.offsetX,y2:e.offsetY});
  redrawLines(); p0=null;
});
dc.addEventListener('mouseleave',()=>{ if(drawing){drawing=false;redrawLines();} });

// ═══════════════════════════════════════
// TOAST
// ═══════════════════════════════════════
let tt=null;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  if(tt)clearTimeout(tt);
  tt=setTimeout(()=>el.classList.remove('show'),2500);
}

// ═══════════════════════════════════════
// ARRANQUE
// ═══════════════════════════════════════
window.addEventListener('load', ()=>{ resize(); cargarDatos('SPY'); });
window.addEventListener('resize', ()=>{ resize(); });
</script>
