<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS — Charts</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #080b0f;
    --surface:  #0d1117;
    --surface2: #161b22;
    --border:   #21262d;
    --accent:   #f0b429;
    --green:    #3fb950;
    --red:      #f85149;
    --cyan:     #58a6ff;
    --text:     #c9d1d9;
    --dim:      #6e7681;
    --mono:     'JetBrains Mono', monospace;
    --disp:     'Bebas Neue', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo { font-family: var(--disp); font-size: 24px; letter-spacing: 3px; color: var(--accent); }
  .logo span { color: var(--dim); font-size: 11px; font-family: var(--mono); display: block; letter-spacing: 1px; }
  .asset-tabs { display: flex; gap: 4px; }
  .asset-tab {
    padding: 5px 14px; border: 1px solid var(--border);
    background: transparent; color: var(--dim);
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    cursor: pointer; border-radius: 4px; transition: all 0.15s; letter-spacing: 1px;
  }
  .asset-tab:hover { border-color: var(--accent); color: var(--text); }
  .asset-tab.active { background: var(--accent); border-color: var(--accent); color: #000; }
  .price-box { margin-left: auto; display: flex; align-items: baseline; gap: 8px; }
  .price-val { font-size: 22px; font-weight: 700; }
  .price-chg { font-size: 12px; font-weight: 600; }
  .up { color: var(--green); }
  .dn { color: var(--red); }
  .status-pill { font-size: 10px; color: var(--dim); padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; }
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .tg { display: flex; align-items: center; gap: 5px; padding-right: 10px; border-right: 1px solid var(--border); }
  .tg:last-child { border-right: none; margin-left: auto; }
  .tlbl { font-size: 9px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .tbtn {
    padding: 3px 9px; border: 1px solid var(--border);
    background: transparent; font-family: var(--mono);
    font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 3px; transition: all 0.15s;
  }
  .tbtn.s20  { color: #f0b429; border-color: #f0b429; }
  .tbtn.s40  { color: #e05c1a; border-color: #e05c1a; }
  .tbtn.s100 { color: #58a6ff; border-color: #58a6ff; }
  .tbtn.s200 { color: #bc8cff; border-color: #bc8cff; }
  .tbtn.on.s20  { background: #f0b429; color: #000; }
  .tbtn.on.s40  { background: #e05c1a; color: #fff; }
  .tbtn.on.s100 { background: #58a6ff; color: #000; }
  .tbtn.on.s200 { background: #bc8cff; color: #000; }
  .tbtn.off { opacity: 0.3; }
  .dbtn {
    padding: 4px 11px; border: 1px solid var(--border);
    background: transparent; color: var(--dim);
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    cursor: pointer; border-radius: 3px; transition: all 0.15s;
  }
  .dbtn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(88,166,255,0.1); }
  .dbtn:hover  { border-color: var(--cyan); color: var(--cyan); }
  .dbtn.danger:hover { border-color: var(--red); color: var(--red); }
  #loading { font-size: 11px; color: var(--dim); }
  .chart-wrap { flex: 1; position: relative; padding: 12px 16px; overflow: hidden; }
  #myChart { width: 100% !important; height: 100% !important; }
  #drawCanvas {
    position: absolute; top: 12px; left: 16px;
    pointer-events: none; z-index: 10;
  }
  #drawCanvas.draw-mode { pointer-events: all; cursor: crosshair; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 7px 18px; border-radius: 6px;
    font-size: 12px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">AXIS<span>CHARTS v1.0</span></div>
  <div class="asset-tabs">
    <button class="asset-tab active" onclick="cambiar('SPY')">SPY</button>
    <button class="asset-tab" onclick="cambiar('AAPL')">AAPL</button>
    <button class="asset-tab" onclick="cambiar('BA')">BA</button>
    <button class="asset-tab" onclick="cambiar('GLD')">GLD</button>
  </div>
  <div class="price-box">
    <span class="price-val" id="pval">—</span>
    <span class="price-chg" id="pchg"></span>
  </div>
  <div class="status-pill" id="spill">3 meses · Velas AXIS 1h</div>
</header>

<div class="toolbar">
  <div class="tg">
    <span class="tlbl">SMA</span>
    <button class="tbtn s20 on"  id="b20"  onclick="togSMA(20)">20</button>
    <button class="tbtn s40 on"  id="b40"  onclick="togSMA(40)">40</button>
    <button class="tbtn s100 on" id="b100" onclick="togSMA(100)">100</button>
    <button class="tbtn s200 on" id="b200" onclick="togSMA(200)">200</button>
  </div>
  <div class="tg">
    <span class="tlbl">Dibujo</span>
    <button class="dbtn" id="bdraw" onclick="togDraw()">✏ Línea</button>
    <button class="dbtn danger" onclick="clearLines()">✕ Limpiar</button>
  </div>
  <div class="tg"><span id="loading">Cargando...</span></div>
</div>

<div class="chart-wrap">
  <canvas id="myChart"></canvas>
  <canvas id="drawCanvas"></canvas>
</div>
<div class="toast" id="toast"></div>

<script>
const TD_KEY     = '66dd71373a884f7bb7da8e6e5e469571';
const OUTPUTSIZE = 500;
let activo   = 'SPY';
let myChart  = null;
let smaState = { 20:true, 40:true, 100:true, 200:true };
let drawMode = false, drawing = false, p0 = null;
let userLines = {};
const dc   = document.getElementById('drawCanvas');
const dctx = dc.getContext('2d');

function calcSMA(velas, period) {
  return velas.map((v,i) => {
    if (i < period-1) return { x: v.x, y: null };
    const avg = velas.slice(i-period+1,i+1).reduce((s,c) => s+c.c, 0) / period;
    return { x: v.x, y: avg };
  });
}

async function cargarDatos(sym) {
  document.getElementById('loading').textContent = `Cargando ${sym}...`;
  try {
    const url  = `https://api.twelvedata.com/time_series?symbol=${sym}&interval=1h&outputsize=${OUTPUTSIZE}&timezone=America/New_York&apikey=${TD_KEY}`;
    const res  = await fetch(url);
    const data = await res.json();
    if (!data.values) throw new Error(data.message || 'Sin datos TwelveData');

    const velas = data.values
      .filter(v => { const h = parseInt(v.datetime.slice(11,13)); return h >= 9 && h <= 15; })
      .reverse()
      .map(v => ({
        x: new Date(v.datetime.replace(' ','T') + '-04:00').getTime(),
        o: parseFloat(v.open),
        h: parseFloat(v.high),
        l: parseFloat(v.low),
        c: parseFloat(v.close),
      }));

    renderChart(velas, sym);
    updatePrecio(velas);
    const desde = new Date(velas[0].x).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    document.getElementById('loading').textContent = `${velas.length} velas · desde ${desde}`;
  } catch(e) {
    document.getElementById('loading').textContent = 'Error: ' + e.message;
    toast('Error: ' + e.message);
  }
}

function renderChart(velas, sym) {
  if (myChart) { myChart.destroy(); myChart = null; }
  const ctx = document.getElementById('myChart').getContext('2d');
  myChart = new Chart(ctx, {
    type: 'candlestick',
    data: {
      datasets: [
        {
          type: 'candlestick', label: sym,
          data: velas.map(v => ({ x:v.x, o:v.o, h:v.h, l:v.l, c:v.c })),
          color: { up:'#3fb950', down:'#f85149', unchanged:'#c9d1d9' },
          borderColor: { up:'#3fb950', down:'#f85149', unchanged:'#c9d1d9' },
        },
        makeSMA(velas, 20,  '#f0b429'),
        makeSMA(velas, 40,  '#e05c1a'),
        makeSMA(velas, 100, '#58a6ff'),
        makeSMA(velas, 200, '#bc8cff'),
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0d1117',
          borderColor: '#21262d', borderWidth: 1,
          titleColor: '#6e7681', bodyColor: '#c9d1d9',
          titleFont: { family:'JetBrains Mono', size:10 },
          bodyFont:  { family:'JetBrains Mono', size:11 },
          callbacks: {
            title: items => {
              const d = new Date(items[0].parsed.x);
              return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/New_York'}) + ' EST';
            },
            label: item => {
              if (item.dataset.type === 'candlestick') {
                const r = item.raw;
                return [`O:$${r.o?.toFixed(2)} H:$${r.h?.toFixed(2)} L:$${r.l?.toFixed(2)} C:$${r.c?.toFixed(2)}`];
              }
              return item.dataset.label + ': $' + (item.parsed.y?.toFixed(2) ?? '—');
            }
          }
        }
      },
      scales: {
        x: {
          type: 'timeseries',
          ticks: { color:'#6e7681', font:{family:'JetBrains Mono',size:10}, maxRotation:0, maxTicksLimit:12 },
          grid: { color:'#161b22' }, border: { color:'#21262d' },
        },
        y: {
          position: 'right',
          ticks: { color:'#6e7681', font:{family:'JetBrains Mono',size:10}, callback: v => '$'+v.toFixed(2) },
          grid: { color:'#161b22' }, border: { color:'#21262d' },
        },
      },
    },
  });
  [20,40,100,200].forEach(p => {
    const ds = myChart.data.datasets.find(d => d.label === 'SMA'+p);
    if (ds) ds.hidden = !smaState[p];
  });
  myChart.update('none');
}

function makeSMA(velas, period, color) {
  return {
    type: 'line', label: 'SMA'+period,
    data: calcSMA(velas, period),
    borderColor: color, borderWidth: 1,
    pointRadius: 0, tension: 0,
    parsing: { xAxisKey:'x', yAxisKey:'y' },
    hidden: !smaState[period],
  };
}

function updatePrecio(velas) {
  if (!velas.length) return;
  const last = velas[velas.length-1], prev = velas[velas.length-2];
  document.getElementById('pval').textContent = '$' + last.c.toFixed(2);
  if (prev) {
    const d = last.c - prev.c, pct = (d/prev.c*100).toFixed(2);
    const el = document.getElementById('pchg');
    el.textContent = (d>=0?'+':'') + d.toFixed(2) + ' ('+pct+'%)';
    el.className   = 'price-chg ' + (d>=0?'up':'dn');
  }
}

function cambiar(sym) {
  activo = sym;
  document.querySelectorAll('.asset-tab').forEach(b => b.classList.toggle('active', b.textContent === sym));
  cargarDatos(sym);
}

function togSMA(p) {
  smaState[p] = !smaState[p];
  const btn = document.getElementById('b'+p);
  btn.classList.toggle('on', smaState[p]);
  btn.classList.toggle('off', !smaState[p]);
  if (myChart) {
    const ds = myChart.data.datasets.find(d => d.label === 'SMA'+p);
    if (ds) { ds.hidden = !smaState[p]; myChart.update('none'); }
  }
}

function resizeDC() {
  const w = document.querySelector('.chart-wrap');
  dc.width = w.clientWidth-32; dc.height = w.clientHeight-24;
  redraw();
}

function togDraw() {
  drawMode = !drawMode;
  dc.classList.toggle('draw-mode', drawMode);
  document.getElementById('bdraw').classList.toggle('active', drawMode);
  toast(drawMode ? 'Modo dibujo ON — click y arrastra' : 'Modo dibujo OFF');
}

function clearLines() {
  userLines[activo] = [];
  dctx.clearRect(0, 0, dc.width, dc.height);
  toast('Líneas eliminadas');
}

function redraw() {
  dctx.clearRect(0, 0, dc.width, dc.height);
  (userLines[activo]||[]).forEach(l => line(l.x1,l.y1,l.x2,l.y2,false));
}

function line(x1,y1,x2,y2,pre) {
  dctx.beginPath(); dctx.moveTo(x1,y1); dctx.lineTo(x2,y2);
  dctx.strokeStyle = pre ? 'rgba(88,166,255,0.5)' : '#58a6ff';
  dctx.lineWidth   = pre ? 1 : 1.5;
  dctx.setLineDash(pre ? [4,4] : []);
  dctx.stroke(); dctx.setLineDash([]);
}

dc.addEventListener('mousedown', e => { if (!drawMode) return; drawing=true; p0={x:e.offsetX,y:e.offsetY}; });
dc.addEventListener('mousemove', e => { if (!drawMode||!drawing||!p0) return; redraw(); line(p0.x,p0.y,e.offsetX,e.offsetY,true); });
dc.addEventListener('mouseup',   e => {
  if (!drawMode||!drawing||!p0) return; drawing=false;
  const dx=e.offsetX-p0.x, dy=e.offsetY-p0.y;
  if (Math.sqrt(dx*dx+dy*dy)<5) return;
  if (!userLines[activo]) userLines[activo]=[];
  userLines[activo].push({x1:p0.x,y1:p0.y,x2:e.offsetX,y2:e.offsetY});
  redraw(); p0=null;
});
dc.addEventListener('mouseleave', () => { if (drawing) { drawing=false; redraw(); } });
window.addEventListener('resize', () => { resizeDC(); redraw(); });

let tt=null;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  if(tt) clearTimeout(tt);
  tt=setTimeout(()=>el.classList.remove('show'),2500);
}

window.addEventListener('load', () => { resizeDC(); cargarDatos('SPY'); });
</script>
</body>
</html>
