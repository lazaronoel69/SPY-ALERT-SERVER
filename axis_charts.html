<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS — Charts</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #080b0f;
    --surface: #0d1117;
    --border:  #21262d;
    --accent:  #f0b429;
    --green:   #3fb950;
    --red:     #f85149;
    --cyan:    #58a6ff;
    --text:    #c9d1d9;
    --dim:     #6e7681;
    --mono:    'JetBrains Mono', monospace;
    --disp:    'Bebas Neue', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--mono); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  header {
    display:flex; align-items:center; gap:16px;
    padding:8px 20px; background:var(--surface);
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .logo { font-family:var(--disp); font-size:24px; letter-spacing:3px; color:var(--accent); line-height:1; }
  .logo small { display:block; font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:1px; }

  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .tab {
    padding:5px 14px; border:1px solid var(--border); background:transparent;
    color:var(--dim); font-family:var(--mono); font-size:12px; font-weight:600;
    cursor:pointer; border-radius:4px; transition:all 0.15s; letter-spacing:1px;
  }
  .tab:hover { border-color:var(--accent); color:var(--text); }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#000; }

  .tf-selector { display:flex; gap:4px; align-items:center; margin-left:12px; }
  .tf-btn {
    padding:4px 9px; border:1px solid var(--border); background:transparent;
    color:var(--dim); font-family:var(--mono); font-size:11px; font-weight:600;
    cursor:pointer; border-radius:4px; transition:all 0.15s; letter-spacing:0.5px;
  }
  .tf-btn:hover { border-color:var(--accent); color:var(--text); }
  .tf-btn.on { background:rgba(79,195,247,0.15); border-color:var(--accent); color:var(--accent); }

  .strat-selector { display:flex; gap:3px; align-items:center; margin-left:12px; }
  .strat-btn {
    padding:3px 7px; border:1px solid var(--border); background:transparent;
    color:var(--dim); font-family:var(--mono); font-size:10px; font-weight:600;
    cursor:pointer; border-radius:4px; transition:all 0.15s; letter-spacing:0.5px;
  }
  .strat-btn:hover { border-color:#ffd700; color:var(--text); }
  .strat-btn.on { background:rgba(255,215,0,0.12); border-color:#ffd700; color:#ffd700; }

  .price-box { margin-left:auto; display:flex; align-items:baseline; gap:8px; }
  .pval { font-size:22px; font-weight:700; }
  .pchg { font-size:12px; font-weight:600; }
  .up { color:var(--green); } .dn { color:var(--red); }

  .toolbar {
    display:flex; align-items:center; gap:8px;
    padding:6px 20px; background:var(--surface);
    border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap;
  }
  .tg { display:flex; align-items:center; gap:5px; padding-right:10px; border-right:1px solid var(--border); }
  .tg:last-child { border-right:none; margin-left:auto; }
  .tlbl { font-size:9px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }

  .btn {
    padding:3px 9px; border:1px solid var(--border); background:transparent;
    font-family:var(--mono); font-size:11px; font-weight:600;
    cursor:pointer; border-radius:3px; transition:all 0.15s; color:var(--dim);
  }
  .btn:hover { border-color:var(--cyan); color:var(--cyan); }
  .btn.s20  { color:#f0b429; border-color:#f0b429; }
  .btn.s40  { color:#e05c1a; border-color:#e05c1a; }
  .btn.s100 { color:#58a6ff; border-color:#58a6ff; }
  .btn.s200 { color:#bc8cff; border-color:#bc8cff; }
  .btn.on.s20  { background:#f0b429; color:#000; }
  .btn.on.s40  { background:#e05c1a; color:#fff; }
  .btn.on.s100 { background:#58a6ff; color:#000; }
  .btn.on.s200 { background:#bc8cff; color:#000; }
  .btn.off { opacity:0.3; }
  .btn.draw-on { border-color:var(--cyan); color:var(--cyan); background:rgba(88,166,255,0.1); }
  .btn.danger:hover { border-color:var(--red); color:var(--red); }

  #info { font-size:11px; color:var(--dim); }

  .chart-wrap { flex:1; position:relative; overflow:hidden; }
  canvas { position:absolute; top:0; left:0; }
  #chartCanvas { cursor:default; }
  #drawCanvas  { pointer-events:none; z-index:5; }
  #drawCanvas.draw-mode { pointer-events:all; cursor:crosshair; }

  /* Tooltip */
  #tooltip {
    position:absolute; display:none;
    background:#0d1117; border:1px solid #21262d;
    border-radius:5px; padding:8px 12px;
    font-size:11px; pointer-events:none; z-index:20;
    min-width:190px;
  }
  #tooltip .tt-title { color:var(--accent); font-weight:700; margin-bottom:5px; font-size:11px; }
  #tooltip .tt-row   { display:flex; justify-content:space-between; gap:14px; }
  #tooltip .tt-lbl   { color:var(--dim); }
  #tooltip .tt-val   { color:var(--text); font-weight:600; }

  /* Panel P's */
  #panel-ps {
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    background:var(--surface); border:1px solid var(--border);
    border-radius:6px; padding:12px 14px; z-index:30;
    min-width:220px; font-size:11px;
    display:none;
  }
  #panel-ps h4 { color:var(--accent); font-size:11px; letter-spacing:2px; margin-bottom:10px; text-transform:uppercase; }
  .ps-row { display:flex; align-items:center; gap:6px; margin-bottom:7px; }
  .ps-lbl { color:var(--dim); width:22px; flex-shrink:0; font-weight:700; }
  .ps-input {
    flex:1; background:#0d1117; border:1px solid var(--border);
    color:var(--text); font-family:var(--mono); font-size:11px;
    padding:3px 7px; border-radius:3px; width:80px;
  }
  .ps-input:focus { outline:none; border-color:var(--cyan); }
  .ps-vela {
    width:38px; background:#0d1117; border:1px solid var(--border);
    color:var(--dim); font-family:var(--mono); font-size:11px;
    padding:3px 5px; border-radius:3px;
  }
  .ps-vela:focus { outline:none; border-color:var(--cyan); }
  .ps-status { font-size:10px; color:var(--dim); margin-bottom:8px; min-height:14px; }
  .ps-tipo { font-size:10px; font-weight:700; letter-spacing:1px; margin-bottom:8px; }
  .ps-tipo.rcb  { color:#f0b429; }
  .ps-tipo.cnf  { color:#58a6ff; }
  .ps-tipo.none { color:var(--dim); }
  .btn-ps-act {
    width:100%; padding:5px; background:var(--accent); color:#000;
    border:none; border-radius:3px; font-family:var(--mono);
    font-size:11px; font-weight:700; cursor:pointer; letter-spacing:1px;
    margin-bottom:5px;
  }
  .btn-ps-act:hover { opacity:0.85; }
  .btn-ps-clear {
    width:100%; padding:4px; background:transparent; color:var(--red);
    border:1px solid var(--red); border-radius:3px; font-family:var(--mono);
    font-size:10px; cursor:pointer;
  }
  .btn-ps-clear:hover { background:rgba(248,81,73,0.1); }
  .ps-toggle {
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    background:var(--surface); border:1px solid var(--border);
    border-radius:4px; padding:4px 8px; cursor:pointer;
    font-size:10px; color:var(--dim); z-index:30; display:none;
  }

  .toast {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#161b22; border:1px solid var(--border); color:var(--text);
    padding:7px 18px; border-radius:6px; font-size:12px;
    z-index:100; opacity:0; transition:opacity 0.3s; pointer-events:none;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <div class="logo">AXIS<small>CHARTS v1.3.3 — SEÑALES</small></div>
  <div class="tabs">
    <button class="tab on"  data-activo="SPY"  onclick="cambiar('SPY')">SPY</button>
    <button class="tab"     data-activo="AAPL" onclick="cambiar('AAPL')">AAPL</button>
    <button class="tab"     data-activo="BA"   onclick="cambiar('BA')">BA</button>
    <button class="tab"     data-activo="GLD"  onclick="cambiar('GLD')">GLD</button>
    <button class="tab"     data-activo="NVDA" onclick="cambiar('NVDA')">NVDA</button>
    <button class="tab"     data-activo="AMZN" onclick="cambiar('AMZN')">AMZN</button>
    <button class="tab"     data-activo="GOOG" onclick="cambiar('GOOG')">GOOG</button>
    <button class="tab"     data-activo="META" onclick="cambiar('META')">META</button>
  </div>
  <div class="tf-selector">
    <button class="tf-btn" data-tf="15min"   onclick="cambiarTF('15min')">15m</button>
    <button class="tf-btn on" data-tf="1H"   onclick="cambiarTF('1H')">1H</button>
    <button class="tf-btn" data-tf="daily"   onclick="cambiarTF('daily')">D</button>
    <button class="tf-btn" data-tf="weekly"  onclick="cambiarTF('weekly')">W</button>
    <button class="tf-btn" data-tf="monthly" onclick="cambiarTF('monthly')">M</button>
  </div>
  <div class="strat-selector">
    <button class="strat-btn on" data-strat="1VR"  onclick="toggleStrat('1VR')">1VR</button>
    <button class="strat-btn on" data-strat="RPG"  onclick="toggleStrat('RPG')">RPG</button>
    <button class="strat-btn on" data-strat="GNA"  onclick="toggleStrat('GNA')">GNA</button>
    <button class="strat-btn on" data-strat="GBA"  onclick="toggleStrat('GBA')">GBA</button>
    <button class="strat-btn on" data-strat="HED"  onclick="toggleStrat('HED')">HED</button>
    <button class="strat-btn on" data-strat="PM40" onclick="toggleStrat('PM40')">PM40</button>
    <button class="strat-btn on" data-strat="CNF"  onclick="toggleStrat('CNF')">CNF</button>
    <button class="strat-btn on" data-strat="RCB"  onclick="toggleStrat('RCB')">RCB</button>
    <button class="strat-btn on" data-strat="4PS"  onclick="toggleStrat('4PS')">4PS</button>
  </div>
  <div class="price-box">
    <span id="reloj" style="font-size:11px;font-weight:600;color:var(--dim);letter-spacing:1px;margin-right:12px;font-family:'JetBrains Mono',monospace;"></span>
    <span id="activo-label" style="font-size:15px;font-weight:700;color:var(--dim);letter-spacing:2px;margin-right:4px;">SPY</span>
    <span class="pval" id="pval">—</span>
    <span class="pchg" id="pchg"></span>
  </div>
  <div style="display:flex;gap:8px;margin-left:auto;flex-shrink:0;">
    <a href="/" style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;color:var(--dim);font-size:11px;text-decoration:none;letter-spacing:1px;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--text)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--dim)'">⌂ HOME</a>
    <a href="/portfolio" style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;color:var(--dim);font-size:11px;text-decoration:none;letter-spacing:1px;" onmouseover="this.style.borderColor='#ffd700';this.style.color='var(--text)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--dim)'">🏆 PORTFOLIO</a>
  </div>
</header>

<div class="toolbar">
  <div class="tg">
    <span class="tlbl">SMA</span>
    <button class="btn s20 on"  id="b20"  onclick="togSMA(20)">20</button>
    <button class="btn s40 on"  id="b40"  onclick="togSMA(40)">40</button>
    <button class="btn s100 on" id="b100" onclick="togSMA(100)">100</button>
    <button class="btn s200 on" id="b200" onclick="togSMA(200)">200</button>
  </div>
  <div class="tg">
    <span class="tlbl">Vista</span>
    <button class="btn" onclick="fitChart()">⊡ Fit</button>
  </div>
  <div class="tg">
    <span class="tlbl">Dibujo</span>
    <button class="btn" id="bdraw" onclick="togDraw()">✏ Línea</button>
    <button class="btn danger" onclick="clearLines()">✕ Limpiar</button>
  </div>
  <div class="tg">
    <span class="tlbl">Canal</span>
    <button class="btn" id="btn-panel-ps" onclick="togPanelPs()">⊞ P's</button>
  </div>
  <div class="tg"><span id="info">Cargando...</span></div>
</div>

<div class="chart-wrap" id="wrap">
  <canvas id="chartCanvas"></canvas>
  <canvas id="drawCanvas"></canvas>

  <!-- Panel de P's -->
  <div id="panel-ps">
    <h4 id="ps-titulo">Canal — SPY</h4>
    <div class="ps-tipo none" id="ps-tipo">SIN CANAL</div>
    <div id="ps-apagado-banner" style="display:none;background:rgba(248,81,73,0.12);border:1px solid #f85149;border-radius:6px;padding:6px 10px;margin-bottom:8px;font-size:11px;color:#f85149;font-family:'JetBrains Mono',monospace;letter-spacing:0.5px;">
      🔕 CANAL DESACTIVADO
    </div>
    <div class="ps-status" id="ps-status">Cargando...</div>
    <div class="ps-row">
      <span class="ps-lbl">P1</span>
      <select class="ps-vela" id="ps-p1-vela">
        <option>V1</option><option>V2</option><option>V3</option>
        <option>V4</option><option>V5</option><option>V6</option><option>V7</option>
      </select>
      <input class="ps-input" id="ps-p1-high" type="number" step="0.01" placeholder="High P1">
      <input class="ps-input" id="ps-p1-fecha" type="date" style="width:110px" onclick="try{this.showPicker()}catch(e){}">
    </div>
    <div class="ps-row">
      <span class="ps-lbl">P2</span>
      <select class="ps-vela" id="ps-p2-vela">
        <option>V1</option><option>V2</option><option>V3</option>
        <option>V4</option><option>V5</option><option>V6</option><option>V7</option>
      </select>
      <input class="ps-input" id="ps-p2-high" type="number" step="0.01" placeholder="High P2">
      <input class="ps-input" id="ps-p2-fecha" type="date" style="width:110px" onclick="try{this.showPicker()}catch(e){}">
    </div>
    <div class="ps-row">
      <span class="ps-lbl" style="color:#f0b429">P3</span>
      <select class="ps-vela" id="ps-p3-vela">
        <option value="">--</option>
        <option>V1</option><option>V2</option><option>V3</option>
        <option>V4</option><option>V5</option><option>V6</option><option>V7</option>
      </select>
      <input class="ps-input" id="ps-p3-low" type="number" step="0.01" placeholder="Low P3 (RCB)">
      <input class="ps-input" id="ps-p3-fecha" type="date" style="width:110px" onclick="try{this.showPicker()}catch(e){}">
    </div>
    <div class="ps-row" style="margin-top:4px;font-size:10px;color:var(--dim)">
      <span>Techo:</span><span id="ps-techo">—</span>
      <span style="margin-left:8px">Mitad:</span><span id="ps-mitad">—</span>
      <span style="margin-left:8px">Piso:</span><span id="ps-piso">—</span>
    </div>
    <button class="btn-ps-act" onclick="activarCanal()">⬆ ACTIVAR CANAL</button>
    <button class="btn-ps-act" style="background:#1a3a2a;border-color:#1D9E75;color:#5ecba8;" onclick="actualizarP2()">↻ ACTUALIZAR P2</button>
    <button class="btn-ps-clear" onclick="desactivarCanal()">✕ DESACTIVAR</button>
  </div>

  <div id="tooltip">
    <div class="tt-title" id="tt-title"></div>
    <div class="tt-row"><span class="tt-lbl">Open</span><span class="tt-val" id="tt-o"></span></div>
    <div class="tt-row"><span class="tt-lbl">High</span><span class="tt-val" id="tt-h"></span></div>
    <div class="tt-row"><span class="tt-lbl">Low</span> <span class="tt-val" id="tt-l"></span></div>
    <div class="tt-row"><span class="tt-lbl">Close</span><span class="tt-val" id="tt-c" style="color:var(--green)"></span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const RAILWAY = 'https://web-production-bf9d0.up.railway.app';
const ACTIVOS = ['SPY','AAPL','BA','GLD','NVDA','AMZN','GOOG','META'];

// Colores
const C = {
  up:'#3fb950', dn:'#f85149', wick:'#484f58',
  sma:{ 20:'#f0b429', 40:'#e05c1a', 100:'#58a6ff', 200:'#bc8cff' },
  grid:'rgba(255,255,255,0.05)', gridH:'rgba(255,255,255,0.08)',
  dayLine:'rgba(240,180,41,0.3)', dayLabel:'#484f58',
  forming:'rgba(88,166,255,0.6)',
};

// Estado
let activo    = 'SPY';
let timeframe = '1H';  // 15min | 1H | daily | weekly | monthly
let allVelas  = [];
let stratState = { '1VR':true, 'RPG':true, 'GNA':true, 'GBA':true, 'HED':true, 'PM40':true, 'CNF':true, 'RCB':true, '4PS':true };
let señalesHistoricas = {};  // { "2026-06-12": ["CNF","1VR"], ... }

// ── Cache del browser ──
// Evita llamadas repetidas a Railway cuando ya tienes los datos en sesión
const _velasCache   = {};  // sym → velas procesadas
const _canalCache   = {};  // sym → estado canal
const _señalesCache = {};  // sym → historial señales
function invalidarCanal(sym) { delete _canalCache[sym]; }
function invalidarVelas(sym)  { delete _velasCache[sym]; }
window.canalRailway = { on: false };
window.canalLineas  = null;
window.senalesHoy   = [];
let smaState  = { 20:true, 40:true, 100:true, 200:true };
let drawMode  = false, drawing = false, p0 = null;
let userLines = {};
let zoomStart = 0, zoomEnd = 0;
let panActive = false, panX0 = null, panZ0 = null;
let refreshTimer = null;
let hoveredIdx = -1;

// Canvas
const wrap = document.getElementById('wrap');
const cc   = document.getElementById('chartCanvas');
const dc   = document.getElementById('drawCanvas');
const ctx  = cc.getContext('2d');
const dctx = dc.getContext('2d');

// Márgenes del área de gráfica
const M = { top:30, right:70, bottom:30, left:10 };

// ═══════════════════════════════════════
// UTILIDADES
// ═══════════════════════════════════════
function esMercadoAbierto() {
  const est  = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const d = est.getDay(), h = est.getHours(), m = est.getMinutes();
  const mins = h*60+m;
  return d>=1 && d<=5 && mins>=570 && mins<960; // 9:30-16:00 EST
}

function velaLabel(tsMs) {
  const h = parseInt(new Date(tsMs).toLocaleString('en-US',{hour:'numeric',hour12:false,timeZone:'America/New_York'}));
  const m = new Date(tsMs).getMinutes();
  // V1 abre a las 9:30 EST
  if (h===9 && m===30) return 'V1 · 9:30–10:00 EST';
  // V2-V7 abren en hora en punto
  return ({10:'V2',11:'V3',12:'V4',13:'V5',14:'V6',15:'V7',16:'V7'}[h]||'V?') + ' · ' + h + ':00 EST';
}

function fmtFecha(tsMs) {
  return new Date(tsMs).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'America/New_York'});
}

function fmtDia(tsMs) {
  return new Date(tsMs).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/New_York'});
}

function calcSMA(velas, period) {
  return velas.map((v,i) => {
    if (i < period-1) return null;
    return velas.slice(i-period+1,i+1).reduce((s,c)=>s+c.c,0)/period;
  });
}

// ═══════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  cc.width = w; cc.height = h;
  dc.width = w; dc.height = h;
  render();
  redrawLines();
}

// ═══════════════════════════════════════
// CARGAR DATOS — Tradier 15min via Railway
// ═══════════════════════════════════════
function cambiarTF(tf) {
  timeframe = tf;
  document.querySelectorAll('.tf-btn').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-tf') === tf)
  );
  allVelas = []; zoomStart = 0; zoomEnd = 0;
  cargarDatos(activo);
}

function toggleStrat(strat) {
  stratState[strat] = !stratState[strat];
  document.querySelectorAll('.strat-btn').forEach(b => {
    if (b.getAttribute('data-strat') === strat)
      b.classList.toggle('on', stratState[strat]);
  });
  render();
}

async function cargarSenalesHistoricas(sym) {
  try {
    const res  = await fetch(`${RAILWAY}/señales_historicas?simbolo=${sym}&t=${Date.now()}`);
    const data = await res.json();
    señalesHistoricas = data.señales || {};
    _señalesCache[sym] = señalesHistoricas;  // guardar en cache
  } catch(e) {
    señalesHistoricas = {};
  }
}

async function cargarDatos(sym, silencioso=false) {
  if (!silencioso) document.getElementById('info').textContent = `Cargando ${sym} ${timeframe}...`;
  try {
    let velas = [];

    if (timeframe === '1H' || timeframe === '15min') {
      // Velas AXIS horarias desde base local del servidor
      const url  = `${RAILWAY}/velas?simbolo=${sym}&t=${Date.now()}`;
      const res  = await fetch(url);
      const data = await res.json();
      if (!data.velas || !data.velas.length) throw new Error(data.error || 'Sin datos');

      const estNow     = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
      const vCierre    = {'V1':10,'V2':11,'V3':12,'V4':13,'V5':14,'V6':15,'V7':16};
      const fechaHoyEST = `${estNow.getFullYear()}-${String(estNow.getMonth()+1).padStart(2,'0')}-${String(estNow.getDate()).padStart(2,'0')}`;

      velas = data.velas.reverse().map(v => {
        const dt     = new Date(v.datetime.replace(' ','T') + '-04:00');
        const esHoy  = v.datetime.slice(0,10) === fechaHoyEST;
        const cH     = vCierre[v.vela] || 16;
        const yaT    = esHoy && !v.completa && estNow.getHours() >= cH;
        return {
          x: dt.getTime(), o: parseFloat(v.open), h: parseFloat(v.high),
          l: parseFloat(v.low), c: parseFloat(v.close),
          vela: v.vela || '', datetime: v.datetime,
          completa: v.completa === true || yaT,
        };
      });
      window.senalesHoy = data.senales_hoy || [];

    } else {
      // Diario / semanal / mensual
      const url  = `${RAILWAY}/velas_daily?simbolo=${sym}&tf=${timeframe}&t=${Date.now()}`;
      const res  = await fetch(url);
      const data = await res.json();
      if (!data.velas || !data.velas.length) throw new Error(data.error || 'Sin datos diarios');

      velas = data.velas.reverse().map(v => {
        const dt = new Date(v.datetime + 'T16:00:00-04:00');
        return {
          x: dt.getTime(), o: parseFloat(v.open), h: parseFloat(v.high),
          l: parseFloat(v.low), c: parseFloat(v.close),
          vela: timeframe, datetime: v.datetime, completa: true,
        };
      });
      window.senalesHoy = [];
    }

    allVelas = velas;
    if (!silencioso) { zoomStart=0; zoomEnd=velas.length-1; }
    else { zoomEnd=velas.length-1; zoomStart=Math.max(0,zoomEnd-(panZ0?.rango||zoomEnd)); }

    updatePrecio(velas);
    render();

    // Guardar en cache del browser
    _velasCache[sym] = velas;

    const desde = fmtFecha(velas[0].x);
    const auto  = (esMercadoAbierto() && (timeframe==='1H'||timeframe==='15min')) ? ' · 🟢 auto 60s' : '';
    document.getElementById('info').textContent = `${velas.length} velas · desde ${desde} · ${timeframe}${auto}`;

    clearTimeout(refreshTimer);
    if (esMercadoAbierto() && (timeframe === '1H' || timeframe === '15min'))
      refreshTimer = setTimeout(() => { invalidarVelas(activo); cargarDatos(activo, true); }, 60 * 1000);

  } catch(e) {
    document.getElementById('info').textContent = 'Error: ' + e.message;
    toast('Error: ' + e.message);
  }
}

// Refresh global — actualiza todos los activos en background cada 2 minutos
let globalRefreshTimer = null;
function iniciarRefreshGlobal() {
  if (globalRefreshTimer) clearInterval(globalRefreshTimer);
  actualizarLucesCanal();
  globalRefreshTimer = setInterval(async () => {
    if (!esMercadoAbierto()) return;
    actualizarLucesCanal();
    // Solo refrescar en timeframes intradiarios
    if (timeframe !== '1H' && timeframe !== '15min') return;
    for (const sym of ACTIVOS) {
      try {
        const url  = `${RAILWAY}/velas?simbolo=${sym}&t=${Date.now()}`;
        const res  = await fetch(url);
        const data = await res.json();
        if (!data.velas || !data.velas.length) continue;
        const estN      = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
        const vCierre   = {'V1':10,'V2':11,'V3':12,'V4':13,'V5':14,'V6':15,'V7':16};
        const fechaHoyN = `${estN.getFullYear()}-${String(estN.getMonth()+1).padStart(2,'0')}-${String(estN.getDate()).padStart(2,'0')}`;
        const velas = data.velas.reverse().map(v => {
          const esHoy = v.datetime.slice(0,10) === fechaHoyN;
          const cH    = vCierre[v.vela] || 16;
          const yaT   = esHoy && !v.completa && estN.getHours() >= cH;
          return {
            x: new Date(v.datetime.replace(' ','T')+'-04:00').getTime(),
            o: parseFloat(v.open), h: parseFloat(v.high),
            l: parseFloat(v.low),  c: parseFloat(v.close),
            vela: v.vela||'', datetime: v.datetime,
            completa: v.completa === true || yaT,
          };
        });
        if (sym === activo) { allVelas = velas; zoomEnd = velas.length - 1; render(); }
        if (sym === activo) updatePrecio(velas);
      } catch(e) { /* silencioso */ }
    }
  }, 2 * 60 * 1000);
}

async function actualizarLucesCanal() {
  try {
    const r = await fetch(`${RAILWAY}/canal_estado`);
    const d = await r.json();
    document.querySelectorAll('.tab[data-activo]').forEach(btn => {
      const sym = btn.getAttribute('data-activo');
      if (!d[sym]) return;
      const c = d[sym];
      // Remover luz previa si existe
      const prev = btn.querySelector('.canal-luz');
      if (prev) prev.remove();
      // Agregar luz según estado
      if (c.on && !c.apagado) {
        const luz = document.createElement('span');
        luz.className = 'canal-luz';
        luz.style.cssText = 'display:inline-block;width:6px;height:6px;border-radius:50%;background:#1D9E75;margin-left:5px;vertical-align:middle;flex-shrink:0;';
        btn.appendChild(luz);
      } else if (c.apagado) {
        const luz = document.createElement('span');
        luz.className = 'canal-luz';
        luz.style.cssText = 'display:inline-block;width:6px;height:6px;border-radius:50%;background:#E24B4A;margin-left:5px;vertical-align:middle;flex-shrink:0;';
        btn.appendChild(luz);
      }
    });
  } catch(e) { /* silencioso */ }
}

// ═══════════════════════════════════════
// MOTOR DE SEÑALES AXIS
// Recalcula señales sobre todas las velas
// igual que Pine Script pero en JavaScript
// ═══════════════════════════════════════

// Colores de estrategias
const SC = {
  vr1:  '#f85149', // rojo
  vr1p: '#f85149', // rojo texto amarillo
  rpg:  '#bc8cff', // morado
  gna:  '#3fb950', // verde
  gba:  '#00d4c8', // cyan
  rcb:  '#f0b429', // naranja
  pm40: '#00d4c8', // cian
};

function calcSeñales(velas) {
  // Necesitamos las SMAs globales (calculadas sobre todas las velas)
  const sma20arr  = calcSMA(velas, 20);
  const sma40arr  = calcSMA(velas, 40);
  const sma100arr = calcSMA(velas, 100);
  const sma200arr = calcSMA(velas, 200);

  const señales = []; // { idx, tipo, color, textColor, arriba }
  const canalesPM40 = []; // { p1Idx, p1High, p2Idx, p2High, activo }
  const pisosRPG = []; // { idx, precio, fecha } — para dibujar línea blanca

  // Helpers
  const esV1    = v => v.vela === 'V1';
  const esV2aV7 = v => ['V2','V3','V4','V5','V6','V7'].includes(v.vela);
  const esRoja  = v => v.c < v.o;
  const esVerde = v => v.c > v.o;

  // Vela alcista estricta AXIS — mechaSup/body <= 0.75 (actualizado 05/13)
  const esAlcista = v => {
    const cuerpo   = v.c - v.o;
    const rango    = v.h - v.l;
    const mechaSup = v.h - v.c;
    return v.c > v.o &&
           (rango > 0 ? cuerpo / rango >= 0.15 : false) &&
           (cuerpo > 0 ? mechaSup / cuerpo <= 0.75 : false);
  };

  // Estado por dia
  let v1Close     = null;
  let v7ClosePrev = null;
  let fechaActual = null;

  // Para RPG
  let pisoRPG    = null;
  let diaRPG     = null;
  let rpgFired   = false;
  let pisoRPGS20 = null;
  let pisoRPGS40 = null;

  // Para GNA
  let techoGNA   = null;
  let diaGNA     = null;
  let gnaFired   = false;

  // Para GBA
  let techoGBA   = null;
  let diaGBA     = null;
  let gbaFired   = false;

  // Para PM40 — estado interno
  let pm40Active      = false;
  let pm40P1High      = null;
  let pm40P1Idx       = null;
  let pm40P2High      = null;
  let pm40P2Idx       = null;
  let pm40VelasBajoP1 = 0;
  let pm40P1Maduro    = false;
  // canalesPM40 se puebla SOLO cuando el canal está confirmado con P1+P2 válidos

  // Para 4PASOS
  let ps4Active      = false;
  let ps4P1Low       = null;
  let ps4P1Idx       = null;
  let ps4P2Low       = null;
  let ps4P2Idx       = null;
  let ps4VelasSobreP1 = 0;
  let ps4P1Maduro    = false;
  const canales4PS   = []; // para dibujo

  let canalFired = false;
  let p1Idx = -1, p2Idx = -1;

  // Encontrar índices P1 y P2 del canal Railway si existe
  if (window.canalRailway && window.canalRailway.on && window.canalRailway.p1 && window.canalRailway.p2) {
    const cr = window.canalRailway;
    const esDiario = (timeframe === 'daily' || timeframe === 'weekly' || timeframe === 'monthly');
    allVelas.forEach((v, i) => {
      const dt = (v.datetime||'').trim();
      const f  = dt.substring(0,10);
      const h  = parseInt(dt.substring(11,13));
      if (esDiario) {
        // En diario/semanal/mensual buscar solo por fecha
        if (f === cr.p1.fecha) p1Idx = i;
        if (f === cr.p2.fecha) p2Idx = i;
      } else {
        // En 1H/15min buscar por fecha y hora
        if (f === cr.p1.fecha && h === cr.p1.hora_est) p1Idx = i;
        if (f === cr.p2.fecha && h === cr.p2.hora_est) p2Idx = i;
      }
    });
  }

  for (let i = 0; i < velas.length; i++) {
    const v    = velas[i];
    const s20  = sma20arr[i];
    const s40  = sma40arr[i];
    const s100 = sma100arr[i];
    const s200 = sma200arr[i];
    const fecha = new Date(v.x).toLocaleDateString('en-US',{timeZone:'America/New_York'});

    // Reset diario
    if (fecha !== fechaActual) {
      if (v1Close !== null) {
        for (let j = i - 1; j >= 0; j--) {
          if (velas[j].vela === 'V7') { v7ClosePrev = velas[j].c; break; }
        }
      }
      fechaActual = fecha;
      v1Close   = null;
      pisoRPG   = null; diaRPG  = null; rpgFired  = false;
      techoGNA  = null; diaGNA  = null; gnaFired  = false;
      techoGBA  = null; diaGBA  = null; gbaFired  = false;
    }

    // ── PM40: procesar en TODA vela (V1 a V7) ──
    // Condicion base activa solo si SMAs alineadas
    const smasOk = s20 && s40 && s100 && s200 && s20 > s40 && s40 > s100 && s100 > s200;

    if (smasOk || pm40Active) {
      if (!pm40Active && smasOk) {
        // Iniciar PM40 con esta vela como P1 candidato
        pm40Active      = true;
        pm40P1High      = v.h;
        pm40P1Idx       = i;
        pm40P2High      = null;
        pm40P2Idx       = null;
        pm40VelasBajoP1 = 0;
        pm40P1Maduro    = false;
      } else if (pm40Active) {
        if (v.h >= pm40P1High) {
          // HIGH >= P1 → P1 se mueve, reset completo del estado
          pm40P1High      = v.h;
          pm40P1Idx       = i;
          pm40P2High      = null;
          pm40P2Idx       = null;
          pm40VelasBajoP1 = 0;
          pm40P1Maduro    = false;
        } else {
          // HIGH < P1
          pm40VelasBajoP1++;
          if (pm40VelasBajoP1 >= 3) pm40P1Maduro = true;

          if (pm40P1Maduro) {
            const distancia = i - pm40P1Idx;

            if (pm40P2Idx === null && distancia >= 4) {
              // Fijar P2 — primera vez con distancia suficiente
              pm40P2High = v.h;
              pm40P2Idx  = i;
              // Registrar canal para dibujo
              canalesPM40.push({
                p1Idx: pm40P1Idx, p1High: pm40P1High,
                p2Idx: pm40P2Idx, p2High: pm40P2High,
                señalIdx: null
              });
            } else if (pm40P2Idx !== null) {
              const slope     = (pm40P2High - pm40P1High) / (pm40P2Idx - pm40P1Idx);
              const techoPM40 = pm40P1High + slope * (i - pm40P1Idx);

              if (v.h > techoPM40) {
                if (esAlcista(v) && !esV1(v)) {
                  // SEÑAL PM40
                  señales.push({ idx: i, tipo: 'PM40', color: SC.pm40, textColor: '#000', arriba: false });
                  if (canalesPM40.length > 0) canalesPM40[canalesPM40.length-1].señalIdx = i;
                  pm40Active = false; pm40P1High = null; pm40P1Idx = null;
                  pm40P2High = null; pm40P2Idx = null;
                  pm40VelasBajoP1 = 0; pm40P1Maduro = false;
                } else if (v.h < pm40P1High) {
                  // P2 dinámico — supera techo pero < P1
                  pm40P2High = v.h; pm40P2Idx = i;
                  if (canalesPM40.length > 0) {
                    canalesPM40[canalesPM40.length-1].p2Idx  = i;
                    canalesPM40[canalesPM40.length-1].p2High = v.h;
                  }
                }
              } else if (v.h > pm40P2High && v.h < pm40P1High) {
                // P2 dinámico — high mayor que P2 actual pero < P1 → mejor slope
                pm40P2High = v.h; pm40P2Idx = i;
                if (canalesPM40.length > 0) {
                  canalesPM40[canalesPM40.length-1].p2Idx  = i;
                  canalesPM40[canalesPM40.length-1].p2High = v.h;
                }
              }
            }
          }
        }
      }
    }

    // ── V1 ──
    if (esV1(v)) {
      v1Close = v.c;

      const gapUp   = v7ClosePrev ? (v.o - v7ClosePrev) / v7ClosePrev * 100 : 0;
      const gapDown = v7ClosePrev ? (v7ClosePrev - v.o) / v7ClosePrev * 100 : 0;
      const hayGap  = gapUp >= 0.5 || gapDown >= 0.5; // gap mínimo 0.5%

      // 1VR — requiere UNA de: (RCB 30% del techo) O (SMA40 > SMA20)
      if (esRoja(v)) {
        const c = window.canalRailway;
        // Condición A: dentro RCB entre techo y 30% hacia la media
        let enRCB30 = false;
        if (c && c.on && c.tipo === 'RCB' && c.techo && c.mitad) {
          const zona30 = c.techo - (c.techo - c.mitad) * 0.30;
          enRCB30 = v.c >= zona30 && v.c <= c.techo;
        }
        // Condición B: SMA40 > SMA20
        const sma40gtSma20 = s40 && s20 && s40 > s20;
        if (enRCB30 || sma40gtSma20) {
          const tipo = enRCB30 ? '1VR+' : '1VR';
          señales.push({ idx: i, tipo, color: SC.vr1, textColor: '#fff', arriba: true });
        }
      }

      // RPG — gap 0.5%, V1 verde
      if (hayGap && esVerde(v)) {
        pisoRPG    = v.l;
        diaRPG     = fecha;
        pisoRPGS20 = s20;
        pisoRPGS40 = s40;
        pisosRPG.push({ idx: i, precio: v.l, fecha });
      }

      // GNA
      if (gapUp >= 0.1 && s20 && s40 && s20 > s40 && esVerde(v)) {
        techoGNA = v.c;
        diaGNA   = fecha;
      }

      // GBA
      if (gapDown >= 0.1 && esVerde(v)) {
        techoGBA = v.c;
        diaGBA   = fecha;
      }

      // 4PASOS en V1 — solo si hay canal RCB activo
      if (window.canalRailway && window.canalRailway.on && window.canalRailway.tipo === 'RCB') {
        if (!ps4Active) {
          ps4Active = true; ps4P1Low = v.l; ps4P1Idx = i;
          ps4P2Low = null; ps4P2Idx = null; ps4VelasSobreP1 = 0; ps4P1Maduro = false;
        } else if (v.l <= ps4P1Low) {
          ps4P1Low = v.l; ps4P1Idx = i;
          ps4P2Low = null; ps4P2Idx = null; ps4VelasSobreP1 = 0; ps4P1Maduro = false;
        } else {
          ps4VelasSobreP1++;
          if (ps4VelasSobreP1 >= 3) ps4P1Maduro = true;
        }
      }
    }

    // ── V2-V7 ──
    if (esV2aV7(v)) {

      // RPG — cualquier vela que cierre < piso + UNA de (RCB 30%) O (SMA20>SMA40)
      if (pisoRPG !== null && diaRPG === fecha && !rpgFired) {
        if (v.c < pisoRPG) {
          const c = window.canalRailway;
          let enRCB30rpg = false;
          if (c && c.on && c.tipo === 'RCB' && c.techo && c.mitad) {
            const zona30 = c.techo - (c.techo - c.mitad) * 0.30;
            enRCB30rpg = v.c >= zona30 && v.c <= c.techo;
          }
          const sma20gtSma40 = pisoRPGS20 && pisoRPGS40 && pisoRPGS20 > pisoRPGS40;
          if (enRCB30rpg || sma20gtSma40) {
            const tipo = enRCB30rpg ? 'RPG+' : (sma20gtSma40 ? 'RPG★' : 'RPG');
            señales.push({ idx: i, tipo, color: SC.rpg, textColor: '#fff', arriba: true });
            rpgFired = true;
          }
        }
      }

      // GNA
      if (techoGNA !== null && diaGNA === fecha && !gnaFired) {
        if (esAlcista(v) && v.c > techoGNA) {
          const tipo = v.vela === 'V2' ? 'GNA' : 'GNA+2';
          señales.push({ idx: i, tipo, color: SC.gna, textColor: '#fff', arriba: false });
          gnaFired = true;
        }
      }

      // GBA
      if (techoGBA !== null && diaGBA === fecha && !gbaFired) {
        if (esAlcista(v) && v.c > techoGBA) {
          const tipo = v.vela === 'V2' ? 'GBA' : 'GBA+2';
          señales.push({ idx: i, tipo, color: SC.gba, textColor: '#000', arriba: false });
          gbaFired = true;
        }
      }

      // CNF/RCB — señal visual cuando hay ruptura del techo
      if (window.canalRailway && window.canalRailway.on && !canalFired) {
        const c = window.canalRailway;
        if (c.p1 && c.p2 && p1Idx >= 0 && p2Idx > p1Idx) {
          const slope     = (c.p2.high - c.p1.high) / (p2Idx - p1Idx);
          const absI      = i - zoomStart;
          const techoCNF  = c.p1.high + slope * (absI - p1Idx);
          if (esAlcista(v) && v.c > techoCNF && v.h < c.p1.high) {
            const tipo = c.tipo === 'RCB' ? 'RCB' : 'CNF';
            señales.push({ idx: i, tipo, color: '#00bcd4', textColor: '#000', arriba: false });
            canalFired = true;
          }
        }
      }

      // 4PASOS — V2-V7
      if (ps4Active && ps4P1Maduro && window.canalRailway && window.canalRailway.on) {
        const cr = window.canalRailway;

        // Si precio sale del canal → reset
        if (cr.techo && cr.piso && (v.c > cr.techo || v.c < cr.piso)) {
          ps4Active = false; ps4P1Low = null; ps4P1Idx = null;
          ps4P2Low = null; ps4P2Idx = null; ps4VelasSobreP1 = 0; ps4P1Maduro = false;
        } else if (v.l <= ps4P1Low) {
          ps4P1Low = v.l; ps4P1Idx = i;
          ps4P2Low = null; ps4P2Idx = null; ps4VelasSobreP1 = 0; ps4P1Maduro = false;
        } else {
          const dist4ps = i - ps4P1Idx;
          if (ps4P2Idx === null && dist4ps >= 4) {
            ps4P2Low = v.l; ps4P2Idx = i;
            canales4PS.push({ p1Idx: ps4P1Idx, p1Low: ps4P1Low, p2Idx: ps4P2Idx, p2Low: ps4P2Low, señalIdx: null });
          } else if (ps4P2Idx !== null) {
            const slope4ps  = (ps4P2Low - ps4P1Low) / (ps4P2Idx - ps4P1Idx);
            const piso4ps   = ps4P1Low + slope4ps * (i - ps4P1Idx);

            // P2 dinámico — low mayor que P2 actual (mejor slope ascendente)
            if (v.l > ps4P2Low && v.l > ps4P1Low) {
              ps4P2Low = v.l; ps4P2Idx = i;
              if (canales4PS.length > 0) {
                canales4PS[canales4PS.length-1].p2Idx = i;
                canales4PS[canales4PS.length-1].p2Low = v.l;
              }
            }

            // Zona válida: 25% superior del canal
            const alturaCanal = cr.techo - (cr.piso || 0);
            const zona25      = cr.techo - alturaCanal * 0.25;
            const enZona      = v.c >= zona25;

            // Señal — vela roja rompe soporte en zona válida
            if (esRoja(v) && v.c < piso4ps && enZona) {
              señales.push({ idx: i, tipo: '4PS', color: '#e74c3c', textColor: '#fff', arriba: true });
              if (canales4PS.length > 0) canales4PS[canales4PS.length-1].señalIdx = i;
              ps4Active = false; ps4P1Low = null; ps4P1Idx = null;
              ps4P2Low = null; ps4P2Idx = null; ps4VelasSobreP1 = 0; ps4P1Maduro = false;
            }
          }
        }
      }

    } // fin esV2aV7

    // V7 — guardar close
    if (v.vela === 'V7') v7ClosePrev = v.c;
  }

  return { señales, canalesPM40, canales4PS, pisosRPG };
}

// Dibujar etiqueta de señal en canvas
function dibujarSeñal(ctx, x, y, texto, bgColor, textColor, arriba) {
  const pad  = 4;
  ctx.font   = 'bold 10px JetBrains Mono';
  const tw   = ctx.measureText(texto).width;
  const bw   = tw + pad * 2;
  const bh   = 16;
  const bx   = x - bw / 2;
  const by   = arriba ? y - bh - 4 : y + 4;

  // Fondo
  ctx.fillStyle = bgColor;
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 3);
  ctx.fill();

  // Texto
  ctx.fillStyle = textColor;
  ctx.textAlign = 'center';
  ctx.fillText(texto, x, by + bh - 4);
}

function togPanelPs() {
  const panel = document.getElementById('panel-ps');
  const btn   = document.getElementById('btn-panel-ps');
  const visible = panel.style.display === 'block';
  panel.style.display = visible ? 'none' : 'block';
  btn.classList.toggle('draw-on', !visible);
}

// PANEL DE P's — sincronizado con Railway
// ═══════════════════════════════════════

const VELA_HORA = { V1:9, V2:10, V3:11, V4:12, V5:13, V6:14, V7:15 };

async function cargarEstadoCanal(sym) {
  try {
    // Cargar estado del canal
    const r = await fetch(`${RAILWAY}/canal_estado?activo=${sym}`);
    const data = await r.json();
    const c = data[sym];
    if (!c) return;

    window.canalRailway = c;
    _canalCache[sym] = c;  // guardar en cache
    window.canalLineas  = null; // limpiar lineas anteriores

    // Si hay canal activo cargar líneas calculadas por Railway
    if (c.on && c.p1 && c.p2) {
      const r2 = await fetch(`${RAILWAY}/canal_lineas?activo=${sym}`);
      const d2 = await r2.json();
      if (d2.on && d2.lineas) {
        window.canalLineas = d2.lineas;
        render(); // redibujar con las líneas del canal
      }
    } else {
      window.canalLineas = null;
      render();
    }

    document.getElementById('ps-titulo').textContent = `Canal — ${sym}`;

    const tipoEl   = document.getElementById('ps-tipo');
    const bannerEl = document.getElementById('ps-apagado-banner');

    if (c.on) {
      tipoEl.textContent = c.tipo;
      tipoEl.className   = `ps-tipo ${c.tipo.toLowerCase()}`;
      bannerEl.style.display = 'none';
    } else if (c.apagado) {
      tipoEl.textContent = 'CANAL APAGADO';
      tipoEl.className   = 'ps-tipo none';
      bannerEl.style.display = 'block';
    } else {
      tipoEl.textContent = 'SIN CANAL';
      tipoEl.className   = 'ps-tipo none';
      bannerEl.style.display = 'none';
    }

    // Llenar campos con valores actuales
    if (c.p1) {
      document.getElementById('ps-p1-high').value  = c.p1.high || '';
      document.getElementById('ps-p1-fecha').value = c.p1.fecha || '';
      const v1 = Object.entries(VELA_HORA).find(([,h]) => h === c.p1.hora_est);
      if (v1) document.getElementById('ps-p1-vela').value = v1[0];
    }
    if (c.p2) {
      document.getElementById('ps-p2-high').value  = c.p2.high || '';
      document.getElementById('ps-p2-fecha').value = c.p2.fecha || '';
      const v2 = Object.entries(VELA_HORA).find(([,h]) => h === c.p2.hora_est);
      if (v2) document.getElementById('ps-p2-vela').value = v2[0];
    }
    if (c.p3) {
      document.getElementById('ps-p3-low').value   = c.p3.low || '';
      document.getElementById('ps-p3-fecha').value = c.p3.fecha || '';
      const v3 = Object.entries(VELA_HORA).find(([,h]) => h === c.p3.hora_est);
      if (v3) document.getElementById('ps-p3-vela').value = v3[0];
    } else {
      document.getElementById('ps-p3-low').value   = '';
      document.getElementById('ps-p3-fecha').value = '';
      document.getElementById('ps-p3-vela').value  = '';
    }

    // Mostrar techo/mitad/piso
    document.getElementById('ps-techo').textContent = c.techo ? `$${c.techo}` : '—';
    document.getElementById('ps-mitad').textContent = c.mitad ? `$${c.mitad}` : '—';
    document.getElementById('ps-piso').textContent  = c.piso  ? `$${c.piso}`  : '—';
    document.getElementById('ps-status').textContent = c.on ? '✅ Canal activo' : '⭕ Sin canal activo';
    render();

  } catch(e) {
    document.getElementById('ps-status').textContent = '⚠️ Error conectando Railway';
  }
}

async function activarCanal() {
  const sym    = activo;
  const p1h    = document.getElementById('ps-p1-high').value;
  const p1f    = document.getElementById('ps-p1-fecha').value;
  const p1v    = document.getElementById('ps-p1-vela').value;
  const p2h    = document.getElementById('ps-p2-high').value;
  const p2f    = document.getElementById('ps-p2-fecha').value;
  const p2v    = document.getElementById('ps-p2-vela').value;
  const p3l    = document.getElementById('ps-p3-low').value;
  const p3f    = document.getElementById('ps-p3-fecha').value;
  const p3v    = document.getElementById('ps-p3-vela').value;

  if (!p1h || !p1f || !p2h || !p2f) {
    showToast('⚠️ P1 y P2 son obligatorios');
    return;
  }

  let url = `${RAILWAY}/activar?activo=${sym}`
    + `&p1_high=${p1h}&p1_fecha=${p1f}&p1_hora=${VELA_HORA[p1v]}`
    + `&p2_high=${p2h}&p2_fecha=${p2f}&p2_hora=${VELA_HORA[p2v]}`;

  if (p3l && p3f && p3v) {
    url += `&piso_low=${p3l}&piso_fecha=${p3f}&piso_hora=${VELA_HORA[p3v]}`;
  }

  try {
    document.getElementById('ps-status').textContent = '⏳ Activando...';
    const r = await fetch(url);
    const data = await r.json();
    if (r.ok) {
      showToast(`✅ Canal ${data.status}`);
      invalidarCanal(sym);  // limpiar cache para forzar datos frescos
      await cargarEstadoCanal(sym);
      render();
    } else {
      showToast(`❌ Error: ${data.error}`);
      document.getElementById('ps-status').textContent = `❌ ${data.error}`;
    }
  } catch(e) {
    showToast('❌ Error conectando Railway');
    document.getElementById('ps-status').textContent = '❌ Error de conexión';
  }
}

async function actualizarP2() {
  const p2h = document.getElementById('ps-p2-high').value;
  const p2f = document.getElementById('ps-p2-fecha').value;
  const p2v = document.getElementById('ps-p2-vela').value;
  if (!p2h || !p2f) { showToast('❌ Introduce P2 high y fecha'); return; }
  const p2hora = VELA_HORA[p2v] ?? 10;
  try {
    document.getElementById('ps-status').textContent = '⏳ Actualizando P2...';
    const url = `${RAILWAY}/actualizar_p2?activo=${activo}&p2_high=${p2h}&p2_fecha=${p2f}&p2_hora=${p2hora}`;
    const r   = await fetch(url);
    const d   = await r.json();
    if (r.ok) {
      showToast(`✅ P2 actualizado — techo $${d.techo ?? '—'}`);
      invalidarCanal(activo);  // limpiar cache
      await cargarEstadoCanal(activo);
      cargarDatos(activo);
    } else {
      showToast(`❌ ${d.error || 'Error'}`);
    }
  } catch(e) { showToast('❌ Error conectando Railway'); }
}

async function desactivarCanal() {
  try {
    document.getElementById('ps-status').textContent = '⏳ Desactivando...';
    const r = await fetch(`${RAILWAY}/desactivar?activo=${activo}`);
    if (r.ok) {
      showToast(`✅ Canal desactivado`);
      invalidarCanal(activo);  // limpiar cache
      document.getElementById('ps-p1-high').value  = '';
      document.getElementById('ps-p1-fecha').value = '';
      document.getElementById('ps-p2-high').value  = '';
      document.getElementById('ps-p2-fecha').value = '';
      document.getElementById('ps-p3-low').value   = '';
      document.getElementById('ps-p3-fecha').value = '';
      await cargarEstadoCanal(activo);
      render();
    }
  } catch(e) {
    showToast('❌ Error conectando Railway');
  }
}

// ═══════════════════════════════════════
// RENDER PRINCIPAL
// ═══════════════════════════════════════
function actualizarReloj() {
  const ahora = new Date();
  const opts = {
    timeZone: 'America/New_York',
    weekday: 'short', month: 'short', day: '2-digit',
    year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  };
  const partes = new Intl.DateTimeFormat('en-US', opts).formatToParts(ahora);
  const get = t => partes.find(p=>p.type===t)?.value || '';
  const texto = `${get('weekday')} ${get('month')} ${get('day')} ${get('year')} · ${get('hour')}:${get('minute')}:${get('second')} EST`;
  const el = document.getElementById('reloj');
  if (el) el.textContent = texto;
}
document.addEventListener('DOMContentLoaded', () => {
  actualizarReloj();
  setInterval(actualizarReloj, 1000);
});
function render() {
  if (!allVelas.length) return;
  const W = cc.width, H = cc.height;
  const gW = W - M.left - M.right;
  const gH = H - M.top  - M.bottom;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#080b0f';
  ctx.fillRect(0,0,W,H);

  const visible = allVelas.slice(zoomStart, zoomEnd+1);
  if (!visible.length) return;

  // Rango de precios
  let minP = Infinity, maxP = -Infinity;
  visible.forEach(v => { if (v.l<minP) minP=v.l; if (v.h>maxP) maxP=v.h; });
  const pad = (maxP-minP)*0.05;
  minP -= pad; maxP += pad;

  // Funciones de conversión
  const xOf  = i  => M.left + (i/(visible.length-1||1)) * gW;
  const yOf  = p  => M.top  + (1-(p-minP)/(maxP-minP)) * gH;
  const velW = Math.max(1, Math.min(20, gW/visible.length*0.7));

  // ── Grid horizontal (precios) ──
  const pasos = 8;
  ctx.textAlign = 'left';
  for (let i=0; i<=pasos; i++) {
    const p  = minP + (maxP-minP)*i/pasos;
    const y  = yOf(p);
    ctx.beginPath();
    ctx.moveTo(M.left, y); ctx.lineTo(W-M.right, y);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#484f58';
    ctx.font = '10px JetBrains Mono';
    ctx.textAlign = 'left';
    ctx.fillText('$'+p.toFixed(2), W-M.right+6, y+4);
  }

  // ── Líneas verticales de inicio de día ──
  let fechaAnt = null;
  visible.forEach((v,i) => {
    const f = new Date(v.x).toLocaleDateString('en-US',{timeZone:'America/New_York'});
    if (f !== fechaAnt) {
      fechaAnt = f;
      const x = xOf(i);
      ctx.beginPath();
      ctx.moveTo(x, M.top); ctx.lineTo(x, H-M.bottom);
      ctx.strokeStyle = C.dayLine;
      ctx.lineWidth = 1; ctx.setLineDash([4,4]);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = C.dayLabel;
      ctx.font = '10px JetBrains Mono';
      ctx.textAlign = 'left';
      ctx.fillText(fmtDia(v.x), x+3, M.top+12);
    }
  });

  // ── SMAs ──
  [20,40,100,200].forEach(period => {
    if (!smaState[period]) return;
    const smas = calcSMA(allVelas, period).slice(zoomStart, zoomEnd+1);
    ctx.beginPath();
    let primero = true;
    smas.forEach((val,i) => {
      if (val===null) return;
      const x = xOf(i), y = yOf(val);
      if (primero) { ctx.moveTo(x,y); primero=false; }
      else ctx.lineTo(x,y);
    });
    ctx.strokeStyle = C.sma[period];
    ctx.lineWidth = 1; ctx.stroke();
  });

  // ── Velas ──
  visible.forEach((v,i) => {
    const x    = xOf(i);
    const yO   = yOf(v.o), yC = yOf(v.c);
    const yH   = yOf(v.h), yL = yOf(v.l);
    const sube = v.c >= v.o;
    const color = sube ? C.up : C.dn;
    const isHovered = i === hoveredIdx;

    // Mecha
    ctx.beginPath();
    ctx.moveTo(x, yH); ctx.lineTo(x, yL);
    ctx.strokeStyle = isHovered ? color : C.wick;
    ctx.lineWidth = 1; ctx.stroke();

    // Cuerpo
    const bodyY = Math.min(yO,yC);
    const bodyH = Math.max(1, Math.abs(yC-yO));
    ctx.fillStyle = isHovered ? color : (sube ? C.up+'99' : C.dn+'99');
    ctx.fillRect(x-velW/2, bodyY, velW, bodyH);
    if (isHovered) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.strokeRect(x-velW/2, bodyY, velW, bodyH);
    }
  });

  // ── Señales AXIS ──
  const { señales: todasSeñales, canalesPM40, canales4PS, pisosRPG } = calcSeñales(allVelas);

  // Dibujar canales 4PASOS (soporte alcista dentro de RCB — línea verde punteada)
  canales4PS.forEach(c => {
    if (!c.p2Idx || c.p2Low <= c.p1Low) return;
    const slope = (c.p2Low - c.p1Low) / (c.p2Idx - c.p1Idx);
    const finIdx = c.señalIdx !== null ? c.señalIdx : (allVelas.length - 1);
    const startVis = Math.max(0, c.p1Idx - zoomStart);
    const endVis   = Math.min(visible.length - 1, finIdx - zoomStart);
    if (startVis > endVis) return;
    ctx.beginPath();
    ctx.setLineDash([4,3]);
    ctx.strokeStyle = '#2ecc71';
    ctx.lineWidth = 1.5;
    for (let k = startVis; k <= endVis; k++) {
      const precio = c.p1Low + slope * (k + zoomStart - c.p1Idx);
      if (k === startVis) ctx.moveTo(xOf(k), yOf(precio));
      else ctx.lineTo(xOf(k), yOf(precio));
    }
    ctx.stroke();
    ctx.setLineDash([]);
    // P1 y P2
    [[c.p1Idx, c.p1Low,'P1'],[c.p2Idx, c.p2Low,'P2']].forEach(([idx, low, lbl]) => {
      const vi = idx - zoomStart;
      if (vi < 0 || vi >= visible.length) return;
      ctx.beginPath(); ctx.arc(xOf(vi), yOf(low), 4, 0, Math.PI*2);
      ctx.fillStyle = '#2ecc71'; ctx.fill();
      ctx.font = 'bold 9px JetBrains Mono';
      ctx.textAlign = 'center'; ctx.fillStyle = '#2ecc71';
      ctx.fillText(lbl, xOf(vi), yOf(low) + 14);
    });
  });

  // Dibujar línea blanca tenue del piso RPG
  pisosRPG.forEach(p => {
    const i1 = p.idx - zoomStart;
    if (i1 < 0 || i1 >= visible.length) return;
    // Buscar última vela del mismo día para saber hasta dónde extender
    let finIdx = i1;
    for (let k = i1; k < visible.length; k++) {
      const fk = new Date(visible[k].x).toLocaleDateString('en-US',{timeZone:'America/New_York'});
      if (fk !== p.fecha) break;
      finIdx = k;
    }
    ctx.beginPath();
    ctx.moveTo(xOf(i1), yOf(p.precio));
    ctx.lineTo(xOf(finIdx), yOf(p.precio));
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth   = 1;
    ctx.setLineDash([3, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Dibujar canales PM40 — solo si NO hay canal manual activo (RCB/CNF)
  if (!window.canalRailway || !window.canalRailway.on) {
  canalesPM40.forEach(c => {
    // Solo dibujar canales con P1 y P2 válidos (P2 < P1)
    if (!c.p2Idx || !c.p2High || c.p2High >= c.p1High) return;

    const i1 = c.p1Idx - zoomStart;
    const i2 = c.p2Idx - zoomStart;

    // Calcular hasta dónde llega la línea:
    // Si hubo señal → hasta la señal
    // Si no → solo hasta P2 (no extender más allá)
    const finAbsoluto = c.señalIdx !== null ? c.señalIdx : c.p2Idx;
    const finIdx   = finAbsoluto - zoomStart;
    const startIdx = Math.max(0, i1);
    const endIdx   = Math.min(visible.length - 1, finIdx);

    if (startIdx > endIdx) return;
    if (startIdx >= visible.length) return;

    const slope = (c.p2High - c.p1High) / (c.p2Idx - c.p1Idx);

    // Línea de techo PM40
    ctx.beginPath();
    ctx.setLineDash([5, 3]);
    ctx.strokeStyle = '#00d4c8';
    ctx.lineWidth   = 1.5;

    for (let k = startIdx; k <= endIdx; k++) {
      const precioTecho = c.p1High + slope * (k + zoomStart - c.p1Idx);
      const px = xOf(k);
      const py = yOf(precioTecho);
      if (k === startIdx) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Punto P1
    if (i1 >= 0 && i1 < visible.length) {
      ctx.beginPath();
      ctx.arc(xOf(i1), yOf(c.p1High), 4, 0, Math.PI*2);
      ctx.fillStyle = '#00d4c8';
      ctx.fill();
      ctx.fillStyle = '#00d4c8';
      ctx.font = 'bold 9px JetBrains Mono';
      ctx.textAlign = 'center';
      ctx.fillText('P1', xOf(i1), yOf(c.p1High) - 8);
    }

    // Punto P2
    if (i2 >= 0 && i2 < visible.length) {
      ctx.beginPath();
      ctx.arc(xOf(i2), yOf(c.p2High), 4, 0, Math.PI*2);
      ctx.fillStyle = '#00d4c8';
      ctx.fill();
      ctx.fillStyle = '#00d4c8';
      ctx.font = 'bold 9px JetBrains Mono';
      ctx.textAlign = 'center';
      ctx.fillText('P2', xOf(i2), yOf(c.p2High) - 8);
    }
  }); // fin canalesPM40
  } // fin if !canal manual

  // Dibujar etiquetas de señales recalculadas (históricas)
  todasSeñales.forEach(s => {
    const visIdx = s.idx - zoomStart;
    if (visIdx < 0 || visIdx >= visible.length) return;
    const v  = visible[visIdx];
    const x  = xOf(visIdx);
    const y  = s.arriba ? yOf(v.h) : yOf(v.l);
    dibujarSeñal(ctx, x, y, s.tipo, s.color, s.textColor, s.arriba);
  });

  // Dibujar señales que Railway disparó hoy — fuente de verdad
  // Estas sobreescriben cualquier recálculo del dashboard
  const fechaHoyNY = new Date().toLocaleDateString('en-US',{timeZone:'America/New_York'});
  (window.senalesHoy || []).forEach(s => {
    // Buscar la vela V1 de hoy para anclar la etiqueta
    for (let i = zoomStart; i <= zoomEnd; i++) {
      const v = allVelas[i];
      const fv = new Date(v.x).toLocaleDateString('en-US',{timeZone:'America/New_York'});
      if (fv === fechaHoyNY && v.vela === 'V1') {
        const visIdx = i - zoomStart;
        const x = xOf(visIdx);
        const y = yOf(v.h);
        const color     = s.tipo === '1VR' ? '#f85149' :
                          s.tipo === 'RPG' ? '#9c27b0' :
                          s.tipo === 'GNA' ? '#00bcd4' :
                          s.tipo === 'GBA' ? '#f0b429' :
                          s.tipo === 'PM40'? '#3fb950' :
                          s.tipo === '4PS' ? '#e74c3c' : '#ffffff';
        const textColor = ['GBA','PM40'].includes(s.tipo) ? '#000' : '#fff';
        dibujarSeñal(ctx, x, y, s.tipo, color, textColor, true);
        break;
      }
    }
  });

  // ── Overlay de señales históricas desde /data/axis_señales_historicas.json ──
  const STRAT_COLORS = {
    '1VR': ['#f85149','#fff'], 'RPG': ['#9c27b0','#fff'],
    'GNA': ['#00bcd4','#000'], 'GBA': ['#f0b429','#000'],
    'HED': ['#ff6b6b','#fff'], 'PM40':['#3fb950','#000'],
    'CNF': ['#58a6ff','#fff'], 'RCB': ['#f0b429','#000'],
    '4PS': ['#e74c3c','#fff'],
  };
  Object.entries(señalesHistoricas).forEach(([fecha, estrategias]) => {
    // Filtrar estrategias visibles según toggles
    const visibles = estrategias.filter(e => stratState[e] !== false);
    if (!visibles.length) return;
    // Buscar V1 de esa fecha en visible
    for (let i = zoomStart; i <= zoomEnd; i++) {
      const v  = allVelas[i];
      const fv = (v.datetime||'').slice(0,10);
      if (fv === fecha && v.vela === 'V1') {
        const visIdx = i - zoomStart;
        const x = xOf(visIdx);
        let yOffset = 0;
        visibles.forEach(strat => {
          const [color, textColor] = STRAT_COLORS[strat] || ['#fff','#000'];
          const y = yOf(v.h) - yOffset;
          dibujarSeñal(ctx, x, y, strat, color, textColor, true);
          yOffset += 18;
        });
        break;
      }
    }
  });

  // ── Canales RCB/CNF — misma lógica que PM40 ──
  if (window.canalRailway && window.canalRailway.on) {
    const c     = window.canalRailway;
    const color = c.tipo === 'RCB' ? '#f0b429' : '#58a6ff';

    if (c.p1 && c.p2) {
      // Encontrar índices de P1 y P2 en allVelas
      let p1Idx = -1, p2Idx = -1, p3Idx = -1;
      const esDiarioC = (timeframe === 'daily' || timeframe === 'weekly' || timeframe === 'monthly');
      allVelas.forEach((v, i) => {
        const dt    = (v.datetime||'').trim();
        const fecha = dt.substring(0,10);
        const hora  = parseInt(dt.substring(11,13));
        if (esDiarioC) {
          if (fecha === c.p1.fecha) p1Idx = i;
          if (fecha === c.p2.fecha) p2Idx = i;
          if (c.p3 && fecha === c.p3.fecha) p3Idx = i;
        } else {
          if (fecha === c.p1.fecha && hora === c.p1.hora_est) p1Idx = i;
          if (fecha === c.p2.fecha && hora === c.p2.hora_est) p2Idx = i;
          if (c.p3 && fecha === c.p3.fecha && hora === c.p3.hora_est) p3Idx = i;
        }
      });

      if (p1Idx >= 0 && p2Idx > p1Idx) {
        // Slope en posiciones de vela — igual que PM40
        const slope = (c.p2.high - c.p1.high) / (p2Idx - p1Idx);

        // Distancia fija del canal (RCB) — calculada una sola vez en P3
        let distancia = null;
        if (c.p3 && p3Idx >= 0) {
          const techoEnP3 = c.p1.high + slope * (p3Idx - p1Idx);
          distancia = techoEnP3 - c.p3.low;
        }

        // Dibujar desde P1 hasta la última vela visible
        const startAbs = p1Idx;
        const endAbs   = allVelas.length - 1;
        const startIdx = Math.max(0, startAbs - zoomStart);
        const endIdx   = Math.min(visible.length - 1, endAbs - zoomStart);

        if (startIdx <= endIdx) {
          // Techo
          ctx.beginPath();
          ctx.setLineDash([]);
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          for (let k = startIdx; k <= endIdx; k++) {
            const absK = k + zoomStart;
            const precio = c.p1.high + slope * (absK - p1Idx);
            if (k === startIdx) ctx.moveTo(xOf(k), yOf(precio));
            else ctx.lineTo(xOf(k), yOf(precio));
          }
          ctx.stroke();

          // Mitad y Piso (solo RCB)
          if (distancia !== null) {
            [distancia/2, distancia].forEach((offset, idx) => {
              ctx.beginPath();
              ctx.setLineDash(idx === 0 ? [4,3] : [2,4]);
              ctx.strokeStyle = color;
              ctx.lineWidth = 1.2;
              for (let k = startIdx; k <= endIdx; k++) {
                const absK  = k + zoomStart;
                const precio = (c.p1.high + slope * (absK - p1Idx)) - offset;
                if (k === startIdx) ctx.moveTo(xOf(k), yOf(precio));
                else ctx.lineTo(xOf(k), yOf(precio));
              }
              ctx.stroke();
            });
            ctx.setLineDash([]);
          }

          // Labels al final
          const lastK    = endIdx;
          const lastAbs  = lastK + zoomStart;
          const techoFin = c.p1.high + slope * (lastAbs - p1Idx);
          ctx.fillStyle = color;
          ctx.font = 'bold 9px JetBrains Mono';
          ctx.textAlign = 'right';
          ctx.fillText(`${c.tipo} Techo $${techoFin.toFixed(2)}`, W-M.right-4, yOf(techoFin)-3);
          if (distancia !== null) {
            ctx.fillText(`Mitad $${(techoFin - distancia/2).toFixed(2)}`, W-M.right-4, yOf(techoFin-distancia/2)-3);
            ctx.fillText(`Piso $${(techoFin - distancia).toFixed(2)}`, W-M.right-4, yOf(techoFin-distancia)-3);
          }

          // Punto P1
          const i1 = p1Idx - zoomStart;
          if (i1 >= 0 && i1 < visible.length) {
            ctx.beginPath();
            ctx.arc(xOf(i1), yOf(c.p1.high), 4, 0, Math.PI*2);
            ctx.fillStyle = color; ctx.fill();
            ctx.font = 'bold 9px JetBrains Mono';
            ctx.textAlign = 'center';
            ctx.fillText('P1', xOf(i1), yOf(c.p1.high)-8);
          }

          // Punto P2
          const i2 = p2Idx - zoomStart;
          if (i2 >= 0 && i2 < visible.length) {
            ctx.beginPath();
            ctx.arc(xOf(i2), yOf(c.p2.high), 4, 0, Math.PI*2);
            ctx.fillStyle = color; ctx.fill();
            ctx.font = 'bold 9px JetBrains Mono';
            ctx.textAlign = 'center';
            ctx.fillText('P2', xOf(i2), yOf(c.p2.high)-8);
          }
        }
      }
    }
  }

  // ── Vela en formación — usa campo 'completa' del servidor ──
  if (esMercadoAbierto() && visible.length > 0) {
    // Debug: verificar último elemento
    const lastV = visible[visible.length - 1];
    // Buscar la primera vela incompleta (completa===false)
    let idxFormacion = -1;
    for (let i = visible.length - 1; i >= 0; i--) {
      if (visible[i].completa === false) { idxFormacion = i; break; }
    }
    // Si todas completas pero mercado abierto, marcar la última
    if (idxFormacion < 0) idxFormacion = visible.length - 1;

    const x = xOf(idxFormacion);
    ctx.beginPath();
    ctx.moveTo(x, M.top); ctx.lineTo(x, H-M.bottom);
    ctx.strokeStyle = C.forming;
    ctx.lineWidth = 1.5; ctx.setLineDash([3,3]);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#58a6ff';
    ctx.font = 'bold 10px JetBrains Mono';
    ctx.textAlign = 'center';
    ctx.fillText('EN FORMACIÓN', x, M.top+24);
  }

  // ── Eje X (fechas) ──
  ctx.fillStyle = '#484f58';
  ctx.font = '10px JetBrains Mono';
  ctx.textAlign = 'center';
  const paso = Math.ceil(visible.length/10);
  visible.forEach((v,i) => {
    if (i%paso!==0) return;
    ctx.fillText(fmtDia(v.x), xOf(i), H-M.bottom+16);
  });
}

// ═══════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════
function showTooltip(e) {
  if (!allVelas.length) return;
  const rect   = cc.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  const W = cc.width, H = cc.height;
  const gW = W - M.left - M.right;

  const visible = allVelas.slice(zoomStart, zoomEnd+1);
  const i = Math.round((mouseX - M.left) / gW * (visible.length-1));
  if (i<0||i>=visible.length) { hideTooltip(); return; }

  hoveredIdx = i;
  render();

  const v   = visible[i];
  const tt  = document.getElementById('tooltip');
  const sube = v.c >= v.o;

  document.getElementById('tt-title').textContent = fmtFecha(v.x) + '  ' + velaLabel(v.x);
  document.getElementById('tt-o').textContent = '$'+v.o.toFixed(2);
  document.getElementById('tt-h').textContent = '$'+v.h.toFixed(2);
  document.getElementById('tt-l').textContent = '$'+v.l.toFixed(2);
  const ttC = document.getElementById('tt-c');
  ttC.textContent = '$'+v.c.toFixed(2);
  ttC.style.color = sube ? '#3fb950' : '#f85149';

  // Posición del tooltip
  let tx = e.clientX - rect.left + 16;
  let ty = e.clientY - rect.top  - 10;
  if (tx + 200 > W) tx = mouseX - 210;
  if (ty + 120 > H) ty = H - 130;
  tt.style.left    = tx+'px';
  tt.style.top     = ty+'px';
  tt.style.display = 'block';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
  if (hoveredIdx !== -1) { hoveredIdx = -1; render(); }
}

// ═══════════════════════════════════════
// ZOOM
// ═══════════════════════════════════════
cc.addEventListener('wheel', e => {
  e.preventDefault();
  if (!allVelas.length) return;
  const total  = allVelas.length;
  const rango  = zoomEnd - zoomStart;
  const factor = e.deltaY < 0 ? 0.85 : 1.15;
  const newLen = Math.max(7, Math.min(total, Math.round(rango*factor)));
  const rect   = cc.getBoundingClientRect();
  const relX   = (e.clientX-rect.left) / cc.width;
  const centro = Math.round(zoomStart + rango*relX);
  zoomStart    = Math.max(0, centro - Math.round(newLen/2));
  zoomEnd      = Math.min(total-1, zoomStart+newLen);
  if (zoomEnd===total-1) zoomStart = Math.max(0,zoomEnd-newLen);
  render();
}, { passive:false });

// ═══════════════════════════════════════
// PAN
// ═══════════════════════════════════════
cc.addEventListener('mousedown', e => {
  if (drawMode) return;
  panActive = true;
  panX0     = e.clientX;
  panZ0     = { start:zoomStart, end:zoomEnd, rango:zoomEnd-zoomStart };
  cc.style.cursor = 'grabbing';
});

cc.addEventListener('mousemove', e => {
  if (panActive && panZ0) {
    const gW      = cc.width - M.left - M.right;
    const pxPorV  = gW / (panZ0.rango||1);
    const delta   = Math.round((e.clientX - panX0) / pxPorV);
    let ns        = panZ0.start - delta;
    let ne        = panZ0.end   - delta;
    const total   = allVelas.length;
    if (ns < 0)         { ne -= ns; ns = 0; }
    if (ne > total-1)   { ns -= (ne-(total-1)); ne = total-1; }
    zoomStart = Math.max(0, ns);
    zoomEnd   = Math.min(total-1, ne);
    render();
  } else if (!drawMode) {
    showTooltip(e);
  }
});

cc.addEventListener('mouseup', e => {
  panActive = false; panX0 = null;
  cc.style.cursor = 'default';
});

cc.addEventListener('mouseleave', () => {
  panActive = false;
  cc.style.cursor = 'default';
  hideTooltip();
});

// ═══════════════════════════════════════
// FIT
// ═══════════════════════════════════════
function fitChart() {
  zoomStart=0; zoomEnd=allVelas.length-1;
  render(); toast('Vista completa');
}

// ═══════════════════════════════════════
// SMA TOGGLE
// ═══════════════════════════════════════
function togSMA(p) {
  smaState[p] = !smaState[p];
  document.getElementById('b'+p).classList.toggle('on',  smaState[p]);
  document.getElementById('b'+p).classList.toggle('off', !smaState[p]);
  render();
}

// ═══════════════════════════════════════
// CAMBIAR ACTIVO
// ═══════════════════════════════════════
async function cambiar(sym) {
  activo = sym;
  clearTimeout(refreshTimer);
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-activo') === sym);
  });
  document.getElementById('activo-label').textContent = sym;

  // Si todo está en cache → instantáneo
  if (_canalCache[sym] && _velasCache[sym] && _señalesCache[sym]) {
    window.canalRailway = _canalCache[sym];
    señalesHistoricas   = _señalesCache[sym];
    allVelas = _velasCache[sym];
    zoomStart = 0; zoomEnd = allVelas.length - 1;
    updatePrecio(allVelas);
    render();
    document.getElementById('info').textContent =
      `${allVelas.length} velas · ${timeframe} · ⚡ cache`;
    actualizarPrecioRT();
    // Mantener refresh activo
    clearTimeout(refreshTimer);
    if (esMercadoAbierto() && (timeframe === '1H' || timeframe === '15min'))
      refreshTimer = setTimeout(() => { invalidarVelas(activo); cargarDatos(activo, true); }, 60 * 1000);
    return;
  }

  // Primera vez → cargar en paralelo
  allVelas = []; zoomStart = 0; zoomEnd = 0;
  window.senalesHoy = [];
  señalesHistoricas = {};
  document.getElementById('info').textContent = `Cargando ${sym}...`;

  await Promise.all([
    cargarEstadoCanal(sym),
    cargarSenalesHistoricas(sym),
    cargarDatos(sym),
  ]);
  actualizarPrecioRT();
}

// ═══════════════════════════════════════
// PRECIO HEADER
// ═══════════════════════════════════════
function updatePrecio(velas) {
  if (!velas.length) return;
  const last=velas[velas.length-1], prev=velas[velas.length-2];
  document.getElementById('pval').textContent = '$'+last.c.toFixed(2);
  if (prev) {
    const d=last.c-prev.c, pct=(d/prev.c*100).toFixed(2);
    const el=document.getElementById('pchg');
    el.textContent=(d>=0?'+':'')+d.toFixed(2)+' ('+pct+'%)';
    el.className='pchg '+(d>=0?'up':'dn');
  }
}

// Precio en tiempo real desde Tradier — actualiza cada 30 segundos en mercado abierto
async function actualizarPrecioRT() {
  if (!esMercadoAbierto()) return;
  try {
    const r = await fetch(`${RAILWAY}/precio?simbolo=${activo}`);
    const d = await r.json();
    if (d.precio) {
      document.getElementById('pval').textContent = '$'+d.precio.toFixed(2);
    }
  } catch(e) {}
  if (esMercadoAbierto()) setTimeout(actualizarPrecioRT, 30*1000);
}

// ═══════════════════════════════════════
// DIBUJO DE LINEAS
// ═══════════════════════════════════════
function togDraw() {
  drawMode = !drawMode;
  dc.classList.toggle('draw-mode', drawMode);
  document.getElementById('bdraw').classList.toggle('draw-on', drawMode);
  toast(drawMode ? 'Modo dibujo ON — ESC o click derecho para salir' : 'Modo dibujo OFF');
}

// ESC cancela modo dibujo
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && drawMode) togDraw();
});

// Click derecho en cualquier canvas cancela modo dibujo
[cc, dc].forEach(canvas => {
  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (drawMode) togDraw();
  });
});

function clearLines() {
  userLines[activo]=[];
  dctx.clearRect(0,0,dc.width,dc.height);
  toast('Líneas eliminadas');
}

function redrawLines() {
  dctx.clearRect(0,0,dc.width,dc.height);
  (userLines[activo]||[]).forEach(l=>drawLine(l.x1,l.y1,l.x2,l.y2,false));
}

function drawLine(x1,y1,x2,y2,pre) {
  dctx.beginPath(); dctx.moveTo(x1,y1); dctx.lineTo(x2,y2);
  dctx.strokeStyle = pre?'rgba(88,166,255,0.5)':'#58a6ff';
  dctx.lineWidth   = pre?1:1.5;
  dctx.setLineDash(pre?[4,4]:[]);
  dctx.stroke(); dctx.setLineDash([]);
}

dc.addEventListener('mousedown', e=>{ if(!drawMode)return; drawing=true; p0={x:e.offsetX,y:e.offsetY}; });
dc.addEventListener('mousemove', e=>{ if(!drawMode||!drawing||!p0)return; redrawLines(); drawLine(p0.x,p0.y,e.offsetX,e.offsetY,true); });
dc.addEventListener('mouseup', e=>{
  if(!drawMode||!drawing||!p0)return; drawing=false;
  const dx=e.offsetX-p0.x, dy=e.offsetY-p0.y;
  if(Math.sqrt(dx*dx+dy*dy)<5)return;
  if(!userLines[activo])userLines[activo]=[];
  userLines[activo].push({x1:p0.x,y1:p0.y,x2:e.offsetX,y2:e.offsetY});
  redrawLines(); p0=null;
});
dc.addEventListener('mouseleave',()=>{ if(drawing){drawing=false;redrawLines();} });

// ═══════════════════════════════════════
// TOAST
// ═══════════════════════════════════════
let tt=null;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  if(tt)clearTimeout(tt);
  tt=setTimeout(()=>el.classList.remove('show'),2500);
}

// ═══════════════════════════════════════
// ARRANQUE
// ═══════════════════════════════════════
window.addEventListener('load', async () => { 
  resize(); 
  await cargarEstadoCanal('SPY');
  cargarSenalesHistoricas('SPY');
  cargarDatos('SPY');
  actualizarPrecioRT();
  iniciarRefreshGlobal();
});
window.addEventListener('resize', ()=>{ resize(); });
</script>
