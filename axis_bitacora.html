<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS — Bitácora</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:      #0a0a0f;
  --surface: #111118;
  --border:  #2a2a3a;
  --text:    #e8e8f0;
  --dim:     #666688;
  --accent:  #4fc3f7;
  --mono:    'JetBrains Mono', monospace;
  --sans:    'Space Grotesk', sans-serif;
  --pend:    #f0b429;
  --prog:    #58a6ff;
  --done:    #3fb950;
  --bug:     #f85149;
}
body {
  background: var(--bg); color: var(--text);
  font-family: var(--sans); min-height: 100vh;
}

/* NAV */
nav {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 32px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.nav-logo { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: 3px; }
.nav-links { display: flex; gap: 4px; }
.nav-links a {
  color: var(--dim); text-decoration: none; font-size: 12px; font-family: var(--mono);
  padding: 5px 12px; border-radius: 5px; transition: all 0.15s; letter-spacing: 0.5px;
}
.nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.nav-links a.active { color: var(--accent); }
.btn-add {
  background: rgba(79,195,247,0.1); border: 1px solid var(--accent);
  color: var(--accent); font-family: var(--mono); font-size: 11px;
  font-weight: 700; padding: 6px 16px; border-radius: 6px;
  cursor: pointer; letter-spacing: 1px; transition: all 0.15s;
}
.btn-add:hover { background: rgba(79,195,247,0.2); }

/* MAIN */
main { max-width: 760px; margin: 0 auto; padding: 32px 20px; }

.page-title {
  font-family: var(--mono); font-size: 11px; color: var(--dim);
  letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px;
}

/* ITEM */
.item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 16px 0; border-bottom: 1px solid var(--border);
}
.item:last-child { border-bottom: none; }

.status-dot {
  width: 10px; height: 10px; border-radius: 50%;
  margin-top: 5px; flex-shrink: 0;
}
.dot-pend { background: var(--pend); box-shadow: 0 0 6px var(--pend); }
.dot-prog { background: var(--prog); box-shadow: 0 0 6px var(--prog); }
.dot-done { background: var(--done); }
.dot-bug  { background: var(--bug);  box-shadow: 0 0 6px var(--bug); }

.item-body { flex: 1; }
.item-titulo {
  font-size: 14px; font-weight: 600; color: var(--text);
  margin-bottom: 4px; line-height: 1.4;
}
.item-titulo.done { color: var(--dim); text-decoration: line-through; }
.item-desc { font-size: 12px; color: var(--dim); line-height: 1.6; white-space: pre-wrap; }
.item-meta {
  display: flex; gap: 10px; margin-top: 6px; align-items: center;
  font-family: var(--mono); font-size: 10px; color: var(--dim);
}
.tag-activo { color: var(--accent); font-weight: 700; }
.tag-autor-ai { color: #bc8cff; }
.item-actions { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
.btn-status {
  font-family: var(--mono); font-size: 10px; padding: 3px 8px;
  border-radius: 4px; cursor: pointer; border: 1px solid var(--border);
  background: transparent; color: var(--dim); transition: all 0.15s;
}
.btn-status:hover { border-color: var(--done); color: var(--done); }

/* EMPTY */
.empty { text-align: center; padding: 60px 0; color: var(--dim); }
.empty-icon { font-size: 32px; margin-bottom: 12px; }

/* MODAL */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.75); z-index: 200;
  align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 28px; width: 100%; max-width: 500px; margin: 20px;
}
.modal-title { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 2px; margin-bottom: 20px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 10px; color: var(--dim); font-family: var(--mono); letter-spacing: 1px; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 9px 12px; border-radius: 6px;
  font-size: 13px; font-family: var(--sans); outline: none; transition: border-color 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel { padding: 8px 18px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--dim); cursor: pointer; font-size: 13px; }
.btn-save { padding: 8px 20px; border-radius: 6px; border: 1px solid var(--accent); background: rgba(79,195,247,0.1); color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; font-family: var(--mono); }
.btn-save:hover { background: rgba(79,195,247,0.2); }

/* TOAST */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 10px 20px; border-radius: 8px;
  font-family: var(--mono); font-size: 12px; display: none; z-index: 300;
}
</style>
</head>
<body>

<div id="toast"></div>

<!-- MODAL -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="modal-title">NUEVA ENTRADA</div>
    <div class="field">
      <label>ESTADO</label>
      <select id="f-estado">
        <option value="pend">⏳ Pendiente</option>
        <option value="prog">🔄 En progreso</option>
        <option value="bug">🔴 Bug</option>
        <option value="done">✅ Resuelto</option>
      </select>
    </div>
    <div class="field">
      <label>ACTIVO (opcional)</label>
      <select id="f-activo">
        <option value="">— General —</option>
        <option>SPY</option><option>AAPL</option><option>BA</option>
        <option>GLD</option><option>NVDA</option><option>AMZN</option>
        <option>GOOG</option><option>META</option>
      </select>
    </div>
    <div class="field">
      <label>TÍTULO</label>
      <input id="f-titulo" type="text" placeholder="¿Qué hay que hacer o qué pasó?">
    </div>
    <div class="field">
      <label>DETALLE (opcional)</label>
      <textarea id="f-desc" placeholder="Pasos, observaciones, contexto..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cerrar()">Cancelar</button>
      <button class="btn-save" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<!-- NAV -->
<nav>
  <div class="nav-logo">AXIS</div>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/charts">Charts</a>
    <a href="/portfolio">Portfolio</a>
    <a href="/analisis">Análisis</a>
    <a href="/bitacora" class="active">Bitácora</a>
  </div>
  <button class="btn-add" onclick="abrir()">+ AGREGAR</button>
</nav>

<!-- MAIN -->
<main>
  <div class="page-title">📋 Bitácora AXIS — pendientes y seguimiento</div>
  <div id="lista"></div>
</main>

<script>
let entradas = [];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function dotClass(estado) {
  return { pend:'dot-pend', prog:'dot-prog', done:'dot-done', bug:'dot-bug' }[estado] || 'dot-pend';
}

function render() {
  const lista = document.getElementById('lista');
  // Orden: bugs primero, luego pendientes, en progreso, resueltos al final
  const orden = { bug:0, pend:1, prog:2, done:3 };
  const sorted = [...entradas].sort((a,b) => (orden[a.estado]||1) - (orden[b.estado]||1));

  if (!sorted.length) {
    lista.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>Sin entradas aún</div></div>';
    return;
  }

  lista.innerHTML = sorted.map(e => `
    <div class="item" id="item-${e.id}">
      <div class="status-dot ${dotClass(e.estado)}"></div>
      <div class="item-body">
        <div class="item-titulo ${e.estado==='done'?'done':''}">${e.titulo}</div>
        ${e.descripcion ? `<div class="item-desc">${e.descripcion}</div>` : ''}
        <div class="item-meta">
          ${e.activo ? `<span class="tag-activo">${e.activo}</span>` : ''}
          ${e.autor === 'AXIS-AI' ? `<span class="tag-autor-ai">🤖 AI</span>` : ''}
          <span>${e.fecha}</span>
        </div>
      </div>
      ${e.estado !== 'done' ? `
      <div class="item-actions">
        <button class="btn-status" onclick="marcarResuelto(${e.id})">✓ Resuelto</button>
      </div>` : ''}
    </div>
  `).join('');
}

async function cargar() {
  try {
    const r = await fetch('/bitacora/data');
    const d = await r.json();
    entradas = d.entradas || [];
    render();
  } catch(e) {
    document.getElementById('lista').innerHTML = '<div class="empty"><div>Error cargando bitácora</div></div>';
  }
}

function abrir() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('f-titulo').focus();
}

function cerrar() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('f-titulo').value = '';
  document.getElementById('f-desc').value   = '';
  document.getElementById('f-activo').value = '';
  document.getElementById('f-estado').value = 'pend';
}

async function guardar() {
  const titulo = document.getElementById('f-titulo').value.trim();
  if (!titulo) { toast('⚠️ El título es requerido'); return; }
  try {
    const r = await fetch('/bitacora/agregar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        estado:      document.getElementById('f-estado').value,
        activo:      document.getElementById('f-activo').value,
        titulo,
        descripcion: document.getElementById('f-desc').value.trim(),
        autor:       'Noel',
      }),
    });
    if (r.ok) { cerrar(); toast('✅ Guardado'); await cargar(); }
    else { toast('❌ Error guardando'); }
  } catch(e) { toast('❌ Error de conexión'); }
}

async function marcarResuelto(id) {
  try {
    const r = await fetch('/bitacora/resolver', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    if (r.ok) { toast('✅ Marcado como resuelto'); await cargar(); }
    else { toast('❌ Error'); }
  } catch(e) { toast('❌ Error de conexión'); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) cerrar(); });

cargar();
</script>
</body>
</html>
