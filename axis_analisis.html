<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS — Análisis</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #080810;
    --bg2:     #0e0e1a;
    --bg3:     #13131f;
    --border:  #1e1e2e;
    --text:    #e8e8f4;
    --muted:   #5a5a7a;
    --green:   #00e676;
    --red:     #f85149;
    --gold:    #ffd700;
    --blue:    #4fc3f7;
    --accent:  #7c6af7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif;
         min-height: 100vh; }

  /* HEADER */
  .header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    background: var(--bg2); position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700;
          letter-spacing: -1px; }
  .logo span { color: var(--blue); }
  .nav-links { display: flex; gap: 8px; margin-left: auto; }
  .nav-link {
    background: var(--bg3); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 12px; border-radius: 6px; font-size: 11px; text-decoration: none;
    letter-spacing: 1px; transition: all 0.2s;
  }
  .nav-link:hover { color: var(--text); border-color: var(--blue); }

  /* MAIN */
  .main { padding: 24px; max-width: 1200px; margin: 0 auto; }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab-btn {
    padding: 6px 18px; border: 1px solid var(--border); background: var(--bg2);
    color: var(--muted); border-radius: 6px; font-size: 12px; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; transition: all 0.2s;
  }
  .tab-btn.active { border-color: var(--blue); color: var(--text); background: var(--bg3); }

  /* RESUMEN CARDS */
  .resumen-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 28px;
  }
  .resumen-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; text-align: center;
  }
  .resumen-card .val { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .resumen-card .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase;
                        letter-spacing: 1px; margin-top: 4px; }
  .green { color: var(--green); }
  .red   { color: var(--red); }
  .gold  { color: var(--gold); }
  .blue  { color: var(--blue); }

  /* TABLA */
  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead tr { border-bottom: 2px solid var(--border); }
  th { padding: 10px 12px; text-align: left; color: var(--muted); text-transform: uppercase;
       letter-spacing: 1px; font-size: 10px; font-weight: 600; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:hover td { background: var(--bg2); }

  /* HISTORIAL EXPAND */
  .expand-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
    letter-spacing: 1px; white-space: nowrap;
  }
  .expand-btn:hover { border-color: var(--blue); color: var(--text); }
  .hist-row td { padding: 0; }
  .hist-inner {
    padding: 12px 24px; background: var(--bg3);
    border-left: 2px solid var(--accent);
  }
  .hist-table { width: 100%; font-size: 11px; }
  .hist-table th { padding: 4px 8px; color: var(--muted); font-size: 9px; }
  .hist-table td { padding: 4px 8px; border-bottom: 1px solid var(--border); }

  /* BADGE */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
  }
  .badge-green { background: rgba(0,230,118,0.12); color: var(--green); }
  .badge-red   { background: rgba(248,81,73,0.12);  color: var(--red); }
  .badge-muted { background: var(--bg3); color: var(--muted); }
  .badge-gold  { background: rgba(255,215,0,0.12); color: var(--gold); }

  /* ESTADO */
  .estado-abierta { color: var(--blue); }
  .estado-cerrada { color: var(--muted); }

  /* EMPTY */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }

  /* SECCION */
  .seccion-title {
    font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 14px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .loading { text-align: center; padding: 60px; color: var(--muted); }

  @media (max-width: 600px) {
    .main { padding: 12px; }
    th, td { padding: 8px 6px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">AXIS<span>ANÁLISIS</span></div>
  <div class="nav-links">
    <a href="/" class="nav-link">⌂ HOME</a>
    <a href="/charts" class="nav-link">📊 CHARTS</a>
    <a href="/portfolio" class="nav-link">🏆 PORTFOLIO</a>
  </div>
</div>

<div class="main">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('posiciones')">Posiciones Abiertas</button>
    <button class="tab-btn" onclick="showTab('historial')">Historial Completo</button>
    <button class="tab-btn" onclick="showTab('estadisticas')">Estadísticas</button>
  </div>

  <!-- RESUMEN GENERAL -->
  <div class="resumen-grid" id="resumen-grid">
    <div class="resumen-card"><div class="val blue" id="r-abiertas">—</div><div class="lbl">Abiertas</div></div>
    <div class="resumen-card"><div class="val" id="r-cerradas">—</div><div class="lbl">Cerradas</div></div>
    <div class="resumen-card"><div class="val" id="r-wr">—</div><div class="lbl">Win Rate</div></div>
    <div class="resumen-card"><div class="val" id="r-pl">—</div><div class="lbl">P&L Total</div></div>
    <div class="resumen-card"><div class="val gold" id="r-racha">—</div><div class="lbl">Mejor Racha</div></div>
  </div>

  <!-- TAB POSICIONES ABIERTAS -->
  <div id="tab-posiciones">
    <div class="seccion-title">Posiciones Abiertas — Historial de Precio Diario</div>
    <div class="loading" id="loading-pos">Cargando...</div>
    <div class="tabla-wrap" id="tabla-posiciones" style="display:none;"></div>
  </div>

  <!-- TAB HISTORIAL -->
  <div id="tab-historial" style="display:none;">
    <div class="seccion-title">Historial Completo — Todas las Posiciones Cerradas</div>
    <div class="loading" id="loading-hist">Cargando...</div>
    <div class="tabla-wrap" id="tabla-historial" style="display:none;"></div>
  </div>

  <!-- TAB ESTADÍSTICAS -->
  <div id="tab-estadisticas" style="display:none;">
    <div class="seccion-title">Estadísticas por Estrategia</div>
    <div class="loading" id="loading-stats">Cargando...</div>
    <div id="stats-content" style="display:none;"></div>
  </div>

</div>

<script>
const RAILWAY = 'https://web-production-bf9d0.up.railway.app';

function adminToken() {
  let token = sessionStorage.getItem('axis_admin_token');
  if (!token) {
    token = window.prompt('Token administrativo de AXIS');
    if (token) sessionStorage.setItem('axis_admin_token', token.trim());
  }
  return token;
}

async function adminFetch(url, options = {}) {
  const token = adminToken();
  if (!token) throw new Error('Token administrativo requerido');
  const headers = new Headers(options.headers || {});
  headers.set('X-AXIS-Admin-Token', token);
  return fetch(url, { ...options, headers });
}

function plColor(pct) {
  if (pct === null || pct === undefined) return 'var(--muted)';
  return pct >= 0 ? 'var(--green)' : 'var(--red)';
}
function plBadgeClass(pct) {
  if (pct === null || pct === undefined) return 'badge-muted';
  return pct >= 0 ? 'badge-green' : 'badge-red';
}
function fmtPct(pct) {
  if (pct === null || pct === undefined) return '—';
  return `${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
}
function fmtUsd(v) {
  if (v === null || v === undefined) return '—';
  return `${v >= 0 ? '+' : ''}$${Math.abs(v).toFixed(2)}`;
}

function showTab(tab) {
  ['posiciones','historial','estadisticas'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', b.textContent.toLowerCase().includes(
        t === 'posiciones' ? 'abiert' : t === 'historial' ? 'historial' : 'estad'
      ) && t === tab);
    });
  });
}

// Fix tab button active state
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

function historialRows(hist, posId) {
  if (!hist || !hist.length) {
    return `<tr class="hist-row" id="hist-${posId}" style="display:none;">
      <td colspan="9"><div class="hist-inner" style="color:var(--muted);font-size:11px;">
        Sin historial aún — primer snapshot a las 4:15 PM EST
      </div></td>
    </tr>`;
  }
  const rows = hist.map(h => `
    <tr>
      <td>${h.fecha}</td>
      <td>$${(h.bid||0).toFixed(2)}</td>
      <td><span class="badge ${plBadgeClass(h.pl_pct)}">${fmtPct(h.pl_pct)}</span></td>
      <td style="color:var(--muted);font-size:10px;">${h.nota||''}</td>
    </tr>`).join('');
  return `<tr class="hist-row" id="hist-${posId}" style="display:none;">
    <td colspan="9">
      <div class="hist-inner">
        <table class="hist-table">
          <thead><tr>
            <th>Fecha</th><th>Bid</th><th>P&L%</th><th>Nota</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </td>
  </tr>`;
}

function toggleHist(posId) {
  const row = document.getElementById('hist-' + posId);
  if (!row) return;
  row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}

function renderPosicionesAbiertas(posiciones) {
  const wrap = document.getElementById('tabla-posiciones');
  document.getElementById('loading-pos').style.display = 'none';
  if (!posiciones.length) {
    wrap.innerHTML = '<div class="empty">Sin posiciones abiertas actualmente</div>';
    wrap.style.display = 'block';
    return;
  }
  let html = `<table>
    <thead><tr>
      <th>Activo</th><th>Tipo</th><th>Estrategia</th><th>Strike</th>
      <th>Entrada</th><th>GTC</th><th>Cierre ayer</th><th>Máximo</th>
      <th>Exp</th><th>Historial</th>
    </tr></thead><tbody>`;

  posiciones.forEach(pos => {
    const pct    = pos.pl_pct_actual;
    const maxPct = pos.pl_pct_maximo;
    html += `
      <tr onclick="toggleHist('${pos.id}')" style="cursor:pointer;">
        <td><b>${pos.simbolo}</b></td>
        <td><span class="badge ${pos.tipo === 'PUT' ? 'badge-red' : 'badge-green'}">${pos.tipo}</span></td>
        <td style="color:var(--muted);font-size:11px;">${pos.estrategia}</td>
        <td>$${pos.strike}</td>
        <td>$${pos.precio_entrada.toFixed(2)}</td>
        <td style="color:var(--gold);">$${pos.precio_gtc.toFixed(2)}</td>
        <td><span class="badge ${plBadgeClass(pct)}">${fmtPct(pct)}</span></td>
        <td><span class="badge ${plBadgeClass(maxPct)}">${fmtPct(maxPct)}</span>
            ${pos.fecha_maximo ? `<div style="font-size:9px;color:var(--muted);">${pos.fecha_maximo}</div>` : ''}</td>
        <td style="font-size:11px;color:var(--muted);">${pos.expiration}</td>
        <td><button class="expand-btn" onclick="event.stopPropagation();toggleHist('${pos.id}')">📋 VER</button></td>
      </tr>
      ${historialRows(pos.historial_precios, pos.id)}`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  wrap.style.display = 'block';
}

function renderHistorialCompleto(historial) {
  const wrap = document.getElementById('tabla-historial');
  document.getElementById('loading-hist').style.display = 'none';
  if (!historial.length) {
    wrap.innerHTML = '<div class="empty">Sin operaciones cerradas aún</div>';
    wrap.style.display = 'block';
    return;
  }
  let html = `<table>
    <thead><tr>
      <th>Fecha cierre</th><th>Activo</th><th>Tipo</th><th>Estrategia</th>
      <th>Strike</th><th>Entrada</th><th>Cierre</th>
      <th>P&L%</th><th>P&L$</th><th>Motivo</th><th>Días</th><th>Máximo</th><th>Historial</th>
    </tr></thead><tbody>`;

  [...historial].reverse().forEach(pos => {
    const dias = pos.minutos_abierta ? Math.round(pos.minutos_abierta / 60 / 6.5) : '—';
    html += `
      <tr onclick="toggleHist('h-${pos.id}')" style="cursor:pointer;">
        <td style="font-size:11px;color:var(--muted);">${(pos.ts_cierre||'').substring(0,10)}</td>
        <td><b>${pos.simbolo}</b></td>
        <td><span class="badge ${pos.tipo === 'PUT' ? 'badge-red' : 'badge-green'}">${pos.tipo}</span></td>
        <td style="color:var(--muted);font-size:11px;">${pos.estrategia}</td>
        <td>$${pos.strike}</td>
        <td>$${(pos.precio_entrada||0).toFixed(2)}</td>
        <td>$${(pos.precio_cierre||0).toFixed(2)}</td>
        <td><span class="badge ${plBadgeClass(pos.pl_pct)}">${fmtPct(pos.pl_pct)}</span></td>
        <td style="color:${plColor(pos.pl_usd)};font-weight:600;">${fmtUsd(pos.pl_usd)}</td>
        <td style="font-size:10px;color:var(--muted);">${pos.motivo_cierre||'—'}</td>
        <td style="font-size:11px;">${dias}</td>
        <td><span class="badge ${plBadgeClass(pos.pl_pct_maximo)}">${fmtPct(pos.pl_pct_maximo)}</span>
            ${pos.fecha_maximo ? `<div style="font-size:9px;color:var(--muted);">${pos.fecha_maximo}</div>` : ''}</td>
        <td><button class="expand-btn" onclick="event.stopPropagation();toggleHist('h-${pos.id}')">📋 VER</button></td>
      </tr>
      ${historialRows(pos.historial_precios, 'h-' + pos.id)}`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  wrap.style.display = 'block';
}

function renderEstadisticas(stats) {
  const content = document.getElementById('stats-content');
  document.getElementById('loading-stats').style.display = 'none';

  if (!stats || stats.mensaje) {
    content.innerHTML = `<div class="empty">${stats?.mensaje || 'Sin datos'}</div>`;
    content.style.display = 'block';
    return;
  }

  let html = '';

  // Por estrategia
  html += '<div class="seccion-title" style="margin-top:0;">Por Estrategia</div>';
  html += '<div class="tabla-wrap"><table><thead><tr><th>Estrategia</th><th>Total</th><th>Wins</th><th>Losses</th><th>Win Rate</th><th>P&L Promedio</th><th>P&L Total</th></tr></thead><tbody>';
  Object.entries(stats.por_estrategia || {}).forEach(([k, v]) => {
    html += `<tr>
      <td><b>${k}</b></td><td>${v.total}</td>
      <td style="color:var(--green);">${v.wins}</td>
      <td style="color:var(--red);">${v.losses}</td>
      <td><span class="badge ${parseInt(v.win_rate) >= 50 ? 'badge-green' : 'badge-red'}">${v.win_rate}</span></td>
      <td style="color:${parseFloat(v.pl_pct_avg) >= 0 ? 'var(--green)' : 'var(--red)'};">${v.pl_pct_avg}</td>
      <td style="color:${v.pl_usd >= 0 ? 'var(--green)' : 'var(--red)'};">${fmtUsd(v.pl_usd)}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';

  // Por activo
  html += '<div class="seccion-title" style="margin-top:28px;">Por Activo</div>';
  html += '<div class="tabla-wrap"><table><thead><tr><th>Activo</th><th>Total</th><th>Wins</th><th>Losses</th><th>Win Rate</th><th>P&L Total</th></tr></thead><tbody>';
  Object.entries(stats.por_activo || {}).forEach(([k, v]) => {
    html += `<tr>
      <td><b>${k}</b></td><td>${v.total}</td>
      <td style="color:var(--green);">${v.wins}</td>
      <td style="color:var(--red);">${v.losses}</td>
      <td><span class="badge ${parseInt(v.win_rate) >= 50 ? 'badge-green' : 'badge-red'}">${v.win_rate}</span></td>
      <td style="color:${v.pl_usd >= 0 ? 'var(--green)' : 'var(--red)'};">${fmtUsd(v.pl_usd)}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';

  // Por vela
  html += '<div class="seccion-title" style="margin-top:28px;">Por Vela (Hora de Entrada)</div>';
  html += '<div class="tabla-wrap"><table><thead><tr><th>Vela</th><th>Total</th><th>Wins</th><th>Win Rate</th><th>P&L Total</th></tr></thead><tbody>';
  Object.entries(stats.por_vela || {}).forEach(([k, v]) => {
    html += `<tr>
      <td><b>${k}</b></td><td>${v.total}</td>
      <td style="color:var(--green);">${v.wins}</td>
      <td><span class="badge ${parseInt(v.win_rate) >= 50 ? 'badge-green' : 'badge-red'}">${v.win_rate}</span></td>
      <td style="color:${v.pl_usd >= 0 ? 'var(--green)' : 'var(--red)'};">${fmtUsd(v.pl_usd)}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';

  content.innerHTML = html;
  content.style.display = 'block';
}

async function cargarTodo() {
  try {
    // Cargar análisis data y estadísticas en paralelo
    const [rAnalisis, rStats] = await Promise.all([
      adminFetch(`${RAILWAY}/analisis/data`),
      adminFetch(`${RAILWAY}/estadisticas`)
    ]);
    const analisis = await rAnalisis.json();
    const stats    = await rStats.json();

    // Resumen general
    const total   = analisis.total_cerradas;
    const wins    = (analisis.historial || []).filter(p => (p.pl_usd || 0) > 0).length;
    const wr      = total > 0 ? `${Math.round(wins/total*100)}%` : '—';
    const plTotal = (analisis.historial || []).reduce((s, p) => s + (p.pl_usd || 0), 0);
    const racha   = stats.resumen_general?.mejor_racha || 0;

    document.getElementById('r-abiertas').textContent = analisis.total_abiertas;
    document.getElementById('r-cerradas').textContent = total;
    const wrEl = document.getElementById('r-wr');
    wrEl.textContent = wr;
    wrEl.className = `val ${wins/total >= 0.5 ? 'green' : 'red'}`;
    const plEl = document.getElementById('r-pl');
    plEl.textContent = fmtUsd(plTotal);
    plEl.className = `val ${plTotal >= 0 ? 'green' : 'red'}`;
    document.getElementById('r-racha').textContent = racha;

    renderPosicionesAbiertas(analisis.posiciones_abiertas || []);
    renderHistorialCompleto(analisis.historial || []);
    renderEstadisticas(stats);

  } catch(e) {
    console.error('Error cargando análisis:', e);
    document.getElementById('loading-pos').textContent = 'Error cargando datos';
  }
}

cargarTodo();
</script>
</body>
</html>
