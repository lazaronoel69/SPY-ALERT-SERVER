<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #0a0a0f;
    --bg2:    #111118;
    --bg3:    #1a1a24;
    --border: #2a2a3a;
    --text:   #e8e8f0;
    --muted:  #666688;
    --green:  #1D9E75;
    --red:    #E24B4A;
    --gold:   #BA7517;
    --blue:   #4fc3f7;
    --purple: #b39ddb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; padding: 16px; }

  /* HEADER */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
  .logo { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
  .logo span { color: var(--blue); }
  .clock { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
  .nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .nav a { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); padding: 5px 11px; border-radius: 6px; font-size: 11px; text-decoration: none; letter-spacing: 1px; transition: all 0.15s; }
  .nav a:hover { color: var(--text); border-color: var(--blue); }
  .refresh-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); padding: 5px 11px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .refresh-btn:hover { color: var(--text); border-color: var(--blue); }

  /* CLAUDE */
  .claude-panel { background: linear-gradient(135deg,#1a1a2e,#16213e); border: 1px solid #2d3561; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .claude-header { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--purple); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .claude-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--purple); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .claude-text { font-size: 13px; color: #c5cae9; line-height: 1.6; }
  .claude-empty { color: var(--muted); font-style: italic; font-size: 12px; }
  .claude-update-btn { margin-left: auto; background: none; border: 1px solid #3d3561; color: var(--purple); padding: 3px 10px; border-radius: 10px; font-size: 11px; cursor: pointer; }

  /* SECTION */
  .section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .badge { background: var(--bg3); border: 1px solid var(--border); padding: 1px 7px; border-radius: 20px; font-size: 10px; color: var(--muted); }

  /* GRID */
  .posiciones-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; margin-bottom: 24px; }
  @media (max-width: 600px) { .posiciones-grid { grid-template-columns: 1fr; } }

  /* CARD */
  .pos-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 0; position: relative; overflow: hidden; transition: border-color 0.2s; }
  .pos-card:hover { border-color: #3a3a4a; }
  .pos-card.reto { border-color: rgba(186,117,23,0.35); }
  .card-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .stripe-put  { background: var(--red); }
  .stripe-call { background: var(--green); }
  .card-body { padding: 14px 16px; }

  /* RETO BADGE */
  .reto-tag { position: absolute; top: 10px; right: 12px; font-size: 9px; letter-spacing: 1.5px; color: var(--gold); font-weight: 600; font-family: 'JetBrains Mono', monospace; }

  /* CARD HEADER */
  .card-header { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .simbolo { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .tipo-badge { font-size: 10px; font-weight: 600; letter-spacing: 1px; padding: 2px 8px; border-radius: 4px; }
  .tipo-put  { background: rgba(226,75,74,0.15); color: #f28b8a; }
  .tipo-call { background: rgba(29,158,117,0.15); color: #5ecba8; }
  .estrategia-txt { font-size: 11px; color: var(--muted); }
  .option-sym { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.3px; }

  /* PL */
  .pl-row { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
  .pl-main { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; line-height: 1; }
  .pl-pos { color: var(--green); }
  .pl-neg { color: var(--red); }
  .pl-zero { color: var(--muted); }
  .pl-side { display: flex; flex-direction: column; gap: 2px; padding-bottom: 2px; }
  .pl-max-label { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .pl-max-val { font-size: 11px; font-family: 'JetBrains Mono', monospace; }

  /* METRICS */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .metric-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 3px; }
  .metric-val { font-size: 12px; color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .metric-val.gold { color: var(--gold); }

  /* DAYS */
  .days-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }
  .days-ok   { color: var(--green); }
  .days-warn { color: var(--gold); }
  .days-crit { color: var(--red); }

  /* FOOTER */
  .card-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-top: 1px solid var(--border); gap: 8px; }
  .footer-left { display: flex; flex-direction: column; gap: 2px; }
  .tiempo-txt { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .costo-txt  { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .footer-right { display: flex; gap: 6px; align-items: center; }
  .hist-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 10px; padding: 4px 9px; border-radius: 4px; cursor: pointer; font-family: 'JetBrains Mono', monospace; transition: all 0.15s; white-space: nowrap; }
  .hist-btn:hover { border-color: var(--blue); color: var(--text); }
  .panic-btn { background: var(--red); color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 11px; font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: all 0.15s; text-transform: uppercase; }
  .panic-btn:hover { opacity: 0.85; }

  /* HISTORIAL EXPANDIBLE */
  .hist-expand { padding: 10px 16px 12px; border-top: 1px solid var(--border); }
  .hist-table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .hist-table th { padding: 3px 6px; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; text-align: left; border-bottom: 1px solid var(--border); }
  .hist-table td { padding: 5px 6px; border-bottom: 1px solid rgba(42,42,58,0.5); }
  .hist-table tr:last-child td { border-bottom: none; }

  /* EMPTY */
  .empty-state { text-align: center; padding: 36px; color: var(--muted); font-size: 13px; background: var(--bg2); border: 1px dashed var(--border); border-radius: 12px; margin-bottom: 24px; }

  /* RETO */
  .reto-panel { background: var(--bg2); border: 1px solid rgba(186,117,23,0.3); border-radius: 12px; padding: 14px 16px; margin-bottom: 24px; }
  .reto-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .reto-title { font-size: 14px; font-weight: 700; color: var(--gold); letter-spacing: 0.3px; }
  .reto-toggle { padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
  .reto-toggle.on  { background: rgba(186,117,23,0.2); color: var(--gold); border: 1px solid rgba(186,117,23,0.4); }
  .reto-toggle.off { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }
  .reto-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
  .progress-bar { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), #ff9800); border-radius: 2px; transition: width 0.5s ease; }
  .carriles-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  @media (max-width: 600px) { .carriles-grid { grid-template-columns: repeat(2, 1fr); } }
  .carril { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; transition: border-color 0.2s; }
  .carril.activo { border-color: var(--gold); }
  .carril.eliminado { opacity: 0.35; }
  .carril-num { font-size: 9px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 1px; }
  .carril-capital { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--gold); }
  .carril-ronda { font-size: 9px; color: var(--muted); margin-top: 2px; }
  .carril-pos { font-size: 9px; color: var(--green); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }

  /* HISTORIAL LISTA */
  .historial-lista { display: flex; flex-direction: column; gap: 7px; margin-bottom: 24px; }
  .hist-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
  .hist-left { display: flex; flex-direction: column; gap: 2px; }
  .hist-simbolo { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; }
  .hist-detalle { font-size: 10px; color: var(--muted); }
  .hist-pl-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; }

  /* TOAST */
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border); padding: 9px 18px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity 0.3s; z-index: 200; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">AXIS<span>PORTFOLIO</span></div>
  <div class="clock" id="clock">--:--:-- EST</div>
  <div class="nav">
    <a href="/">⌂ HOME</a>
    <a href="/charts">CHARTS</a>
    <a href="/analisis">ANÁLISIS</a>
    <button class="refresh-btn" onclick="cargarDatos()">↻</button>
  </div>
</div>

<!-- CLAUDE -->
<div class="claude-panel">
  <div class="claude-header">
    <div class="claude-dot"></div>
    Claude — Análisis
    <button class="claude-update-btn" onclick="cargarClaude()">↻ Actualizar</button>
  </div>
  <div class="claude-text" id="claude-msg">
    <span class="claude-empty">Presiona Actualizar para obtener análisis de Claude.</span>
  </div>
</div>

<!-- POSICIONES -->
<div class="section-title">Posiciones Abiertas <span class="badge" id="badge-pos">0</span></div>
<div class="posiciones-grid" id="posiciones-grid">
  <div class="empty-state">Sin posiciones abiertas — esperando señales de AXIS</div>
</div>

<!-- RETO -->
<div class="section-title">Reto Millonario</div>
<div class="reto-panel">
  <div class="reto-header">
    <div class="reto-title">🏆 Reto al Millón</div>
    <button class="reto-toggle off" id="reto-toggle" onclick="toggleReto()">ACTIVAR</button>
  </div>
  <div class="reto-meta">
    <span id="reto-capital">$0.00</span>
    <span id="reto-pct">0.00% del millón</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="reto-progress" style="width:0%"></div></div>
  <div class="carriles-grid" id="carriles-grid"></div>
</div>

<!-- HISTORIAL -->
<div class="section-title">Historial <span class="badge" id="badge-hist">0</span></div>
<div class="historial-lista" id="historial-lista">
  <div class="empty-state">Sin posiciones cerradas aún</div>
</div>

<div class="toast" id="toast"></div>

<script>
const RAILWAY = 'https://web-production-bf9d0.up.railway.app';
let _datos = null;

function actualizarReloj() {
  const est = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const h = String(est.getHours()).padStart(2,'0');
  const m = String(est.getMinutes()).padStart(2,'0');
  const s = String(est.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s} EST`;
}
setInterval(actualizarReloj, 1000);

function toast(msg, dur=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function tiempoAbierto(ts) {
  if (!ts) return '—';
  const diff = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (diff < 60) return `${diff}m`;
  const h = Math.floor(diff / 60), m = diff % 60;
  if (h < 24) return `${h}h ${m}m`;
  return `${Math.floor(h/24)}d ${h%24}h`;
}

function diasRestantes(expiration) {
  if (!expiration) return null;
  const hoy  = new Date(); hoy.setHours(0,0,0,0);
  const exp  = new Date(expiration + 'T00:00:00');
  return Math.ceil((exp - hoy) / 86400000);
}

function diasBadge(dias) {
  if (dias === null) return '';
  const cls = dias <= 2 ? 'days-crit' : dias <= 6 ? 'days-warn' : 'days-ok';
  return `<span class="days-val ${cls}">${dias}d</span>`;
}

function plClass(pct) {
  if (!pct && pct !== 0) return 'pl-zero';
  return pct > 0 ? 'pl-pos' : pct < 0 ? 'pl-neg' : 'pl-zero';
}

function fmtPct(pct) {
  if (pct === null || pct === undefined) return '—';
  return `${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
}

function historialTable(hist, posId) {
  if (!hist || !hist.length) {
    return `<div class="hist-expand" id="hist-${posId}" style="display:none;">
      <span style="font-size:11px;color:var(--muted);">Sin datos aún — primer snapshot a las 4:15 PM</span>
    </div>`;
  }
  const rows = hist.map(h => {
    const cls = !h.pl_pct ? '' : h.pl_pct > 0 ? 'pl-pos' : 'pl-neg';
    return `<tr>
      <td>${h.fecha}</td>
      <td>$${(h.bid||0).toFixed(2)}</td>
      <td class="${cls}">${fmtPct(h.pl_pct)}</td>
      <td style="color:var(--muted)">${h.nota||''}</td>
    </tr>`;
  }).join('');
  return `<div class="hist-expand" id="hist-${posId}" style="display:none;">
    <table class="hist-table">
      <thead><tr><th>Fecha</th><th>Bid</th><th>P&L%</th><th>Nota</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function toggleHistorial(posId) {
  const el = document.getElementById('hist-' + posId);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function renderPosiciones(posiciones) {
  const grid = document.getElementById('posiciones-grid');
  document.getElementById('badge-pos').textContent = posiciones.length;
  if (!posiciones.length) {
    grid.innerHTML = '<div class="empty-state">Sin posiciones abiertas — esperando señales de AXIS</div>';
    return;
  }
  grid.innerHTML = posiciones.map(pos => {
    const tipoCls  = pos.tipo === 'PUT' ? 'tipo-put' : 'tipo-call';
    const stripeCls = pos.tipo === 'PUT' ? 'stripe-put' : 'stripe-call';
    const pct      = pos.pl_pct_actual;
    const maxPct   = pos.pl_pct_maximo;
    const dias     = diasRestantes(pos.expiration);
    const costo    = pos.costo_total ? `$${pos.costo_total.toFixed(0)}` : '—';
    const retoTag  = pos.es_reto ? `<div class="reto-tag">RETO C${pos.carril_id}</div>` : '';
    return `
      <div class="pos-card ${pos.es_reto ? 'reto' : ''}">
        <div class="card-stripe ${stripeCls}"></div>
        ${retoTag}
        <div class="card-body">
          <div class="card-header">
            <span class="simbolo">${pos.simbolo}</span>
            <span class="tipo-badge ${tipoCls}">${pos.tipo}</span>
            <span class="estrategia-txt">${(pos.estrategia||'').split('—')[0].trim()}</span>
          </div>
          <div class="option-sym">${pos.option_symbol||''}</div>
          <div class="pl-row">
            <div class="pl-main ${plClass(pct)}">${fmtPct(pct)}</div>
            <div class="pl-side">
              <div class="pl-max-label">Cierre ayer</div>
              <div class="pl-max-val" style="color:var(--muted);font-size:10px;">
                Máx <span style="color:${maxPct > 0 ? 'var(--green)' : maxPct < 0 ? 'var(--red)' : 'var(--muted)'}">${fmtPct(maxPct)}</span>
                ${pos.fecha_maximo ? `· ${pos.fecha_maximo}` : ''}
              </div>
            </div>
          </div>
          <div class="metrics">
            <div>
              <div class="metric-lbl">Strike</div>
              <div class="metric-val">$${pos.strike}</div>
            </div>
            <div>
              <div class="metric-lbl">Entrada</div>
              <div class="metric-val">$${(pos.precio_entrada||0).toFixed(2)}</div>
            </div>
            <div>
              <div class="metric-lbl">GTC</div>
              <div class="metric-val gold">$${(pos.precio_gtc||0).toFixed(2)}</div>
            </div>
            <div>
              <div class="metric-lbl">Vence en</div>
              ${diasBadge(dias)}
            </div>
          </div>
        </div>
        <div class="card-footer">
          <div class="footer-left">
            <div class="tiempo-txt">${tiempoAbierto(pos.ts_entrada)} abierta</div>
            <div class="costo-txt">${pos.contratos} contrato · ${costo}</div>
          </div>
          <div class="footer-right">
            <button class="hist-btn" onclick="toggleHistorial('${pos.id}')">historial ▾</button>
            <button class="panic-btn" onclick="confirmarPanic('${pos.id}')">PANIC</button>
          </div>
        </div>
        ${historialTable(pos.historial_precios, pos.id)}
      </div>`;
  }).join('');
}

function renderReto(reto) {
  const toggle = document.getElementById('reto-toggle');
  toggle.textContent = reto.activo ? 'PAUSAR' : 'ACTIVAR';
  toggle.className   = `reto-toggle ${reto.activo ? 'on' : 'off'}`;
  const capTotal = reto.carriles.reduce((s,c) => s + (c.capital||0), 0);
  document.getElementById('reto-capital').textContent = `$${capTotal.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const pct = (capTotal / 1000000 * 100).toFixed(4);
  document.getElementById('reto-pct').textContent = `${pct}% del millón`;
  document.getElementById('reto-progress').style.width = Math.min(parseFloat(pct), 100) + '%';
  const grid = document.getElementById('carriles-grid');
  grid.innerHTML = reto.carriles.map(c => {
    if (c.eliminado) return `
      <div class="carril eliminado">
        <div class="carril-num">C${c.id}</div>
        <div class="carril-capital" style="color:var(--red);font-size:10px;">ELIM</div>
        <div class="carril-capital" style="color:var(--muted);">$${(c.capital||0).toFixed(0)}</div>
      </div>`;
    let posInfo = '';
    if (c.posicion && _datos && _datos.posiciones) {
      const pos = _datos.posiciones.find(p => p.id === c.posicion);
      if (pos) posInfo = `<div class="carril-pos">${pos.simbolo} ${pos.tipo}</div>`;
    }
    return `
      <div class="carril ${c.posicion ? 'activo' : ''}">
        <div class="carril-num">C${c.id}</div>
        <div class="carril-capital">$${(c.capital||0).toFixed(0)}</div>
        <div class="carril-ronda">R${c.ronda}</div>
        ${posInfo || (c.posicion ? '<div class="carril-pos">● activo</div>' : '')}
      </div>`;
  }).join('');
}

function renderHistorial(historial) {
  const lista = document.getElementById('historial-lista');
  document.getElementById('badge-hist').textContent = historial.length;
  if (!historial.length) { lista.innerHTML = '<div class="empty-state">Sin posiciones cerradas aún</div>'; return; }
  lista.innerHTML = [...historial].reverse().slice(0,20).map(pos => {
    const pl  = pos.pl_pct || 0;
    const cls = pl > 0 ? 'pl-pos' : pl < 0 ? 'pl-neg' : 'pl-zero';
    const mot = pos.motivo_cierre || '—';
    return `
      <div class="hist-item">
        <div class="hist-left">
          <div class="hist-simbolo">${pos.simbolo} <span style="font-size:11px;color:var(--muted);font-weight:400">${pos.tipo} $${pos.strike}</span></div>
          <div class="hist-detalle">${(pos.estrategia||'').split('—')[0].trim()} · ${mot} · exp ${pos.expiration||'—'}</div>
        </div>
        <div>
          <div class="hist-pl-val ${cls}">${fmtPct(pl)}</div>
          <div style="font-size:10px;color:var(--muted);text-align:right;font-family:'JetBrains Mono',monospace;">${pos.pl_usd >= 0 ? '+' : ''}$${(pos.pl_usd||0).toFixed(2)}</div>
        </div>
      </div>`;
  }).join('');
}

async function cargarDatos() {
  try {
    const r = await adminFetch(`${RAILWAY}/portfolio/data`);
    const d = await r.json();
    _datos = d;
    renderPosiciones(d.posiciones || []);
    renderReto(d.reto || {activo:false, carriles:[]});
    renderHistorial(d.historial || []);
  } catch(e) { toast('Error cargando datos'); }
}

async function confirmarPanic(posId) {
  try {
    const r = await adminFetch(`${RAILWAY}/portfolio/cerrar?id=${posId}&motivo=panic`, { method: 'POST' });
    const d = await r.json();
    if (d.ok) { toast(`Posición cerrada · bid $${(d.bid_usado||0).toFixed(2)}`); cargarDatos(); }
    else toast('Error cerrando posición');
  } catch(e) { toast('Error de conexión'); }
}

async function toggleReto() {
  const activo = _datos?.reto?.activo;
  const url = activo ? `${RAILWAY}/portfolio/reto/desactivar` : `${RAILWAY}/portfolio/reto/activar`;
  try { await adminFetch(url, { method: 'POST' }); cargarDatos(); } catch(e) { toast('Error'); }
}

async function cargarClaude() {
  const el = document.getElementById('claude-msg');
  el.innerHTML = '<span class="claude-empty">Analizando...</span>';
  try {
    const r = await adminFetch(`${RAILWAY}/portfolio/claude`, { method: 'POST' });
    const d = await r.json();
    el.innerHTML = `<span class="claude-text">${d.analisis || 'Sin análisis disponible.'}</span>`;
  } catch(e) { el.innerHTML = '<span class="claude-empty">Error obteniendo análisis.</span>'; }
}

function adminToken() {
  let token = sessionStorage.getItem('axis_admin_token');
  if (!token) {
    token = window.prompt('Token administrativo de AXIS');
    if (token) sessionStorage.setItem('axis_admin_token', token.trim());
  }
  return token;
}

async function adminFetch(url, options = {}) {
  const token = adminToken();
  if (!token) throw new Error('Token administrativo requerido');
  const headers = new Headers(options.headers || {});
  headers.set('X-AXIS-Admin-Token', token);
  return fetch(url, { ...options, headers });
}

cargarDatos();
setInterval(cargarDatos, 60 * 60 * 1000);
</script>
