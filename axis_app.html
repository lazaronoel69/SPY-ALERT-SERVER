<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS — Control Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap');

  :root {
    --bg:        #080c10;
    --surface:   #0d1117;
    --border:    #1e2d3d;
    --accent:    #00e5ff;
    --accent2:   #ff6b35;
    --green:     #00ff88;
    --red:       #ff3366;
    --purple:    #bf5fff;
    --orange:    #ff9500;
    --yellow:    #ffd60a;
    --text:      #c9d1d9;
    --muted:     #4a5568;
    --mono:      'Share Tech Mono', monospace;
    --sans:      'Barlow', sans-serif;
    RAILWAY_URL: '';
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRID BACKGROUND ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: var(--bg);
  }

  .login-box {
    width: 100%;
    max-width: 400px;
    padding: 2rem;
    border: 1px solid var(--border);
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }

  .login-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .login-logo {
    font-family: var(--mono);
    font-size: 2rem;
    color: var(--accent);
    text-align: center;
    letter-spacing: 8px;
    margin-bottom: 0.25rem;
  }

  .login-sub {
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .field {
    margin-bottom: 1rem;
  }

  .field label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
    font-family: var(--mono);
  }

  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 0.95rem;
    padding: 0.7rem 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus {
    border-color: var(--accent);
  }

  .btn-login {
    width: 100%;
    padding: 0.8rem;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 0.9rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: all 0.2s;
  }

  .btn-login:hover {
    background: var(--accent);
    color: var(--bg);
  }

  .login-error {
    color: var(--red);
    font-family: var(--mono);
    font-size: 0.8rem;
    text-align: center;
    margin-top: 0.75rem;
    display: none;
  }

  /* ── MAIN APP ── */
  #app { display: none; position: relative; z-index: 1; }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .header-logo {
    font-family: var(--mono);
    font-size: 1.2rem;
    color: var(--accent);
    letter-spacing: 6px;
  }

  .header-status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .btn-logout:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* ── LAYOUT ── */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  /* ── RAILWAY CONFIG ── */
  .config-bar {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 1.5rem;
    padding: 0.75rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .config-bar label {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .config-bar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.4rem 0.75rem;
    outline: none;
  }

  .config-bar input:focus { border-color: var(--accent); }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  /* ── ACTIVO CARDS ── */
  .activos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .activo-btn {
    padding: 0.75rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 1rem;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    position: relative;
    overflow: hidden;
  }

  .activo-btn::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    width: 0;
    background: var(--accent);
    transition: width 0.2s;
  }

  .activo-btn:hover::after,
  .activo-btn.active::after { width: 100%; }

  .activo-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .activo-badge {
    font-size: 0.6rem;
    letter-spacing: 1px;
    padding: 0.2rem 0.4rem;
    margin-left: 0.5rem;
    vertical-align: middle;
  }

  .badge-on  { background: rgba(0,255,136,0.15); color: var(--green); border: 1px solid var(--green); }
  .badge-off { background: rgba(74,85,104,0.2);  color: var(--muted); border: 1px solid var(--border); }
  .badge-apg { background: rgba(255,51,102,0.15); color: var(--red);  border: 1px solid var(--red); }

  /* ── FORM PANEL ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    position: relative;
  }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  .panel-title {
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 1.25rem;
    text-transform: uppercase;
  }

  .tipo-toggle {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }

  .tipo-btn {
    flex: 1;
    padding: 0.6rem;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tipo-btn.active-cnf {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,229,255,0.05);
  }

  .tipo-btn.active-rcb {
    border-color: var(--orange);
    color: var(--orange);
    background: rgba(255,149,0,0.05);
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .form-group label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .form-group input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 0.5rem 0.75rem;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }

  .form-group input:focus { border-color: var(--accent); }

  .p-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: var(--muted);
    margin: 1rem 0 0.5rem;
    padding: 0.3rem 0;
    border-bottom: 1px dashed var(--border);
    text-transform: uppercase;
  }

  .p-label.p1c { color: var(--accent); }
  .p-label.p2c { color: var(--green); }
  .p-label.p3c { color: var(--orange); }

  .p3-section { display: none; }
  .p3-section.visible { display: block; }

  /* ── BUTTONS ── */
  .btn-row {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.25rem;
  }

  .btn {
    flex: 1;
    padding: 0.75rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid;
    background: transparent;
    transition: all 0.15s;
  }

  .btn-activar {
    border-color: var(--green);
    color: var(--green);
  }
  .btn-activar:hover {
    background: var(--green);
    color: var(--bg);
  }

  .btn-desactivar {
    border-color: var(--red);
    color: var(--red);
  }
  .btn-desactivar:hover {
    background: var(--red);
    color: var(--bg);
  }

  .btn-test {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-test:hover {
    background: var(--accent);
    color: var(--bg);
  }

  /* ── ESTRATEGIAS ── */
  .estrategias-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .estrategia-card {
    padding: 0.75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .estrategia-name {
    font-family: var(--mono);
    font-size: 0.9rem;
    letter-spacing: 2px;
    margin-bottom: 0.25rem;
  }

  .estrategia-state {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 1px;
  }

  .est-on  { border-color: var(--green);  }
  .est-on .estrategia-name  { color: var(--green);  }
  .est-on .estrategia-state { color: var(--green);  }
  .est-off { border-color: var(--border); }
  .est-off .estrategia-name  { color: var(--muted); }
  .est-off .estrategia-state { color: var(--muted); }

  /* ── LOG ── */
  .log-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1rem;
  }

  .log-title {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 3px;
    color: var(--muted);
    margin-bottom: 0.75rem;
    text-transform: uppercase;
  }

  .log-entries {
    max-height: 180px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .log-entry {
    padding: 0.3rem 0.5rem;
    border-left: 2px solid transparent;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; } }

  .log-ok    { border-color: var(--green);  color: var(--green);  background: rgba(0,255,136,0.05); }
  .log-err   { border-color: var(--red);    color: var(--red);    background: rgba(255,51,102,0.05); }
  .log-info  { border-color: var(--accent); color: var(--text);   background: rgba(0,229,255,0.03); }
  .log-warn  { border-color: var(--yellow); color: var(--yellow); background: rgba(255,214,10,0.05); }

  .log-time { color: var(--muted); margin-right: 0.5rem; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    padding: 0.75rem 1.25rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 1px;
    border: 1px solid var(--green);
    background: var(--surface);
    color: var(--green);
    z-index: 999;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
  }

  #toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  #toast.err {
    border-color: var(--red);
    color: var(--red);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr 1fr; }
    .estrategias-grid { grid-template-columns: repeat(2, 1fr); }
    .btn-row { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">AXIS</div>
    <div class="login-sub">Breakout Sentinel — Control Panel</div>
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="AXIS_ADMIN_69" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()">INGRESAR</button>
    <div class="login-error" id="login-error">⚠ Credenciales incorrectas</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-logo">AXIS</div>
    <div class="header-status">
      <div class="dot"></div>
      <span id="header-time">--:-- EST</span>
    </div>
    <button class="btn-logout" onclick="doLogout()">SALIR</button>
  </header>

  <div class="container">

    <!-- RAILWAY URL -->
    <div class="config-bar" id="config-bar">
      <label>RAILWAY URL</label>
      <input type="text" id="railway-url" placeholder="https://web-production-bf9d0.up.railway.app" value="">
      <button class="btn" style="flex:none;padding:0.4rem 1rem;border-color:var(--accent);color:var(--accent);font-size:0.7rem;" onclick="testConexion()">TEST</button>
    </div>

    <!-- ESTRATEGIAS -->
    <div class="section-title">ESTRATEGIAS</div>
    <div class="estrategias-grid">
      <div class="estrategia-card est-on" id="est-vr1" onclick="toggleEstrategia('vr1')">
        <div class="estrategia-name" style="color:var(--red)">1VR</div>
        <div class="estrategia-state">ON</div>
      </div>
      <div class="estrategia-card est-on" id="est-rpg" onclick="toggleEstrategia('rpg')">
        <div class="estrategia-name" style="color:var(--purple)">RPG</div>
        <div class="estrategia-state">ON</div>
      </div>
      <div class="estrategia-card est-on" id="est-gna" onclick="toggleEstrategia('gna')">
        <div class="estrategia-name" style="color:var(--green)">GNA</div>
        <div class="estrategia-state">ON</div>
      </div>
      <div class="estrategia-card est-on" id="est-gba" onclick="toggleEstrategia('gba')">
        <div class="estrategia-name" style="color:var(--accent)">GBA</div>
        <div class="estrategia-state">ON</div>
      </div>
    </div>

    <!-- ACTIVOS -->
    <div class="section-title">ACTIVO</div>
    <div class="activos-grid">
      <button class="activo-btn active" onclick="seleccionarActivo('SPY',this)">
        SPY <span class="activo-badge badge-off" id="badge-SPY">OFF</span>
      </button>
      <button class="activo-btn" onclick="seleccionarActivo('AAPL',this)">
        AAPL <span class="activo-badge badge-off" id="badge-AAPL">OFF</span>
      </button>
      <button class="activo-btn" onclick="seleccionarActivo('BA',this)">
        BA <span class="activo-badge badge-off" id="badge-BA">OFF</span>
      </button>
      <button class="activo-btn" onclick="seleccionarActivo('GLD',this)">
        GLD <span class="activo-badge badge-off" id="badge-GLD">OFF</span>
      </button>
    </div>

    <!-- PANEL DE P's -->
    <div class="panel">
      <div class="panel-title" id="panel-title">CANAL — SPY</div>

      <!-- TIPO CNF / RCB -->
      <div class="tipo-toggle">
        <button class="tipo-btn active-cnf" id="btn-cnf" onclick="setTipo('CNF')">CNF — Sin piso</button>
        <button class="tipo-btn" id="btn-rcb" onclick="setTipo('RCB')">RCB — Con piso</button>
      </div>

      <!-- P1 -->
      <div class="p-label p1c">P1 — Primer Punto</div>
      <div class="form-row">
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="p1-fecha">
        </div>
        <div class="form-group">
          <label>Vela (1-7)</label>
          <input type="number" id="p1-vela" min="1" max="7" value="1">
        </div>
        <div class="form-group">
          <label>High $</label>
          <input type="number" id="p1-high" step="0.01" placeholder="0.00">
        </div>
      </div>

      <!-- P2 -->
      <div class="p-label p2c">P2 — Segundo Punto</div>
      <div class="form-row">
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="p2-fecha">
        </div>
        <div class="form-group">
          <label>Vela (1-7)</label>
          <input type="number" id="p2-vela" min="1" max="7" value="1">
        </div>
        <div class="form-group">
          <label>High $</label>
          <input type="number" id="p2-high" step="0.01" placeholder="0.00">
        </div>
      </div>

      <!-- P3 solo si RCB -->
      <div class="p3-section" id="p3-section">
        <div class="p-label p3c">P3 — Piso del Canal</div>
        <div class="form-row">
          <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="p3-fecha">
          </div>
          <div class="form-group">
            <label>Vela (1-7)</label>
            <input type="number" id="p3-vela" min="1" max="7" value="1">
          </div>
          <div class="form-group">
            <label>Low $</label>
            <input type="number" id="p3-low" step="0.01" placeholder="0.00">
          </div>
        </div>
      </div>

      <!-- BOTONES -->
      <div class="btn-row">
        <button class="btn btn-activar" onclick="activarCanal()">▶ ACTIVAR</button>
        <button class="btn btn-desactivar" onclick="desactivarCanal()">■ DESACTIVAR</button>
      </div>
    </div>

    <!-- LOG -->
    <div class="log-panel">
      <div class="log-title">LOG DE ACTIVIDAD</div>
      <div class="log-entries" id="log"></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const VALID_USER = 'AXIS_ADMIN_69';
// El password se valida contra la variable de entorno en Railway
// Para la app HTML usamos un hash simple del password
// INSTRUCCION: reemplaza el valor de PASS_HASH con el resultado de:
// btoa(tuPassword) en la consola del navegador
const PASS_HASH = sessionStorage.getItem('axis_pass_hash') || '';

let activoSel  = 'SPY';
let tipoCanal  = 'CNF';
let estState   = { vr1: true, rpg: true, gna: true, gba: true };
let sessionKey = null;

// ══════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════
function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err  = document.getElementById('login-error');

  if (user !== VALID_USER) {
    err.style.display = 'block';
    err.textContent = '⚠ Usuario incorrecto';
    return;
  }

  // Guardar hash de session
  sessionKey = btoa(user + ':' + pass + ':AXIS2026');
  sessionStorage.setItem('axis_session', sessionKey);
  sessionStorage.setItem('axis_pass_raw', pass);

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  err.style.display = 'none';

  iniciarApp();
}

function doLogout() {
  sessionStorage.clear();
  location.reload();
}

// Enter en login
document.getElementById('login-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('login-user').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-pass').focus();
});

// Restaurar sesion
window.addEventListener('load', () => {
  const saved = sessionStorage.getItem('axis_session');
  if (saved) {
    sessionKey = saved;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    iniciarApp();
  }
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
function iniciarApp() {
  // Si estamos hosteados en Railway, ocultar config bar
  if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
    const bar = document.getElementById('config-bar');
    if (bar) bar.style.display = 'none';
  }
  actualizarHora();
  setInterval(actualizarHora, 1000);
  setFechasHoy();
  addLog('info', 'AXIS Control Panel iniciado');
  setTimeout(cargarEstado, 800);
}

function actualizarHora() {
  const now = new Date();
  const est = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const h = String(est.getHours()).padStart(2,'0');
  const m = String(est.getMinutes()).padStart(2,'0');
  const s = String(est.getSeconds()).padStart(2,'0');
  document.getElementById('header-time').textContent = `${h}:${m}:${s} EST`;
}

function setFechasHoy() {
  const hoy = new Date().toISOString().split('T')[0];
  ['p1-fecha','p2-fecha','p3-fecha'].forEach(id => {
    document.getElementById(id).value = hoy;
  });
}

// ══════════════════════════════════════════
// RAILWAY URL
// ══════════════════════════════════════════
function getURL() {
  const val = document.getElementById('railway-url').value.replace(/\/$/, '');
  return val || window.location.origin;
}

// ══════════════════════════════════════════
// CARGAR ESTADO DESDE RAILWAY
// ══════════════════════════════════════════
async function cargarEstado() {
  try {
    const r = await fetch(getURL() + '/');
    const data = await r.json();
    // Actualizar badges de canales
    for (const [activo, info] of Object.entries(data.canales || {})) {
      const badge = document.getElementById('badge-' + activo);
      if (!badge) continue;
      badge.className = 'activo-badge';
      if (info.apagado) {
        badge.classList.add('badge-apg');
        badge.textContent = 'APG';
      } else if (info.on) {
        badge.classList.add('badge-on');
        badge.textContent = info.tipo || 'ON';
      } else {
        badge.classList.add('badge-off');
        badge.textContent = 'OFF';
      }
    }
    // Actualizar estrategias
    const est = data.estrategias || {};
    estState.vr1 = est['1VR'] !== false;
    estState.rpg = est['RPG'] !== false;
    estState.gna = est['GNA'] !== false;
    estState.gba = est['GBA'] !== false;
    actualizarEstCards();
    addLog('ok', 'Estado cargado desde Railway');
  } catch(e) {
    addLog('warn', 'No se pudo conectar con Railway');
  }
}

// ══════════════════════════════════════════
// ACTIVO
// ══════════════════════════════════════════
function seleccionarActivo(activo, btn) {
  activoSel = activo;
  document.querySelectorAll('.activo-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-title').textContent = `CANAL — ${activo}`;
  // Limpiar campos de P's al cambiar activo
  limpiarFormulario();
}

function limpiarFormulario() {
  const hoy = new Date().toISOString().split('T')[0];
  document.getElementById('p1-fecha').value = hoy;
  document.getElementById('p1-vela').value = 1;
  document.getElementById('p1-high').value = '';
  document.getElementById('p2-fecha').value = hoy;
  document.getElementById('p2-vela').value = 1;
  document.getElementById('p2-high').value = '';
  document.getElementById('p3-fecha').value = hoy;
  document.getElementById('p3-vela').value = 1;
  document.getElementById('p3-low').value = '';
  // Resetear tipo a CNF
  setTipo('CNF');
}

// ══════════════════════════════════════════
// TIPO CNF / RCB
// ══════════════════════════════════════════
function setTipo(tipo) {
  tipoCanal = tipo;
  const p3  = document.getElementById('p3-section');
  const bCnf = document.getElementById('btn-cnf');
  const bRcb = document.getElementById('btn-rcb');
  if (tipo === 'RCB') {
    p3.classList.add('visible');
    bCnf.classList.remove('active-cnf');
    bRcb.classList.add('active-rcb');
  } else {
    p3.classList.remove('visible');
    bRcb.classList.remove('active-rcb');
    bCnf.classList.add('active-cnf');
  }
}

// ══════════════════════════════════════════
// VELA → HORA
// ══════════════════════════════════════════
function velaAHora(v) {
  const mapa = {1:9,2:10,3:11,4:12,5:13,6:14,7:15};
  return mapa[parseInt(v)] || 9;
}

// ══════════════════════════════════════════
// ACTIVAR CANAL
// ══════════════════════════════════════════
async function activarCanal() {
  const p1f = document.getElementById('p1-fecha').value;
  const p1v = document.getElementById('p1-vela').value;
  const p1h = document.getElementById('p1-high').value;
  const p2f = document.getElementById('p2-fecha').value;
  const p2v = document.getElementById('p2-vela').value;
  const p2h = document.getElementById('p2-high').value;

  if (!p1f || !p1h || !p2f || !p2h) {
    showToast('Completa P1 y P2', true);
    return;
  }

  let url = `${getURL()}/activar?activo=${activoSel}`
    + `&p1_fecha=${p1f}&p1_hora=${velaAHora(p1v)}&p1_high=${p1h}`
    + `&p2_fecha=${p2f}&p2_hora=${velaAHora(p2v)}&p2_high=${p2h}`;

  if (tipoCanal === 'RCB') {
    const p3f = document.getElementById('p3-fecha').value;
    const p3v = document.getElementById('p3-vela').value;
    const p3l = document.getElementById('p3-low').value;
    if (!p3f || !p3l) {
      showToast('Completa P3 para RCB', true);
      return;
    }
    url += `&piso_fecha=${p3f}&piso_hora=${velaAHora(p3v)}&piso_low=${p3l}`;
  }

  addLog('info', `Activando canal ${tipoCanal} — ${activoSel}...`);
  try {
    const r = await fetch(url);
    const data = await r.json();
    if (r.ok) {
      showToast(`Canal ${tipoCanal} activado — ${activoSel}`);
      addLog('ok', `Canal ${tipoCanal} activado para ${activoSel}`);
      await cargarEstado();
    } else {
      showToast(data.error || 'Error al activar', true);
      addLog('err', data.error || 'Error al activar');
    }
  } catch(e) {
    showToast('Error de conexion con Railway', true);
    addLog('err', 'Error de conexion: ' + e.message);
  }
}

// ══════════════════════════════════════════
// DESACTIVAR CANAL
// ══════════════════════════════════════════
async function desactivarCanal() {
  addLog('info', `Desactivando canal — ${activoSel}...`);
  try {
    const r = await fetch(`${getURL()}/desactivar?activo=${activoSel}`);
    const data = await r.json();
    if (r.ok) {
      showToast(`Canal desactivado — ${activoSel}`);
      addLog('ok', `Canal desactivado para ${activoSel}`);
      await cargarEstado();
    } else {
      showToast('Error al desactivar', true);
      addLog('err', 'Error al desactivar');
    }
  } catch(e) {
    showToast('Error de conexion', true);
    addLog('err', 'Error: ' + e.message);
  }
}

// ══════════════════════════════════════════
// TEST CONEXION
// ══════════════════════════════════════════
async function testConexion() {
  addLog('info', 'Enviando /test a Railway...');
  try {
    const r = await fetch(`${getURL()}/test`);
    if (r.ok) {
      showToast('Railway OK — revisa Telegram');
      addLog('ok', 'Test enviado — verifica Telegram');
    } else {
      showToast('Railway respondio con error', true);
      addLog('err', 'Railway error: ' + r.status);
    }
  } catch(e) {
    showToast('Sin conexion con Railway', true);
    addLog('err', 'Sin conexion: ' + e.message);
  }
}

// ══════════════════════════════════════════
// ESTRATEGIAS
// ══════════════════════════════════════════
async function toggleEstrategia(key) {
  estState[key] = !estState[key];
  actualizarEstCards();
  const params = Object.entries(estState).map(([k,v]) => `${k}=${v}`).join('&');
  try {
    await fetch(`${getURL()}/estrategia?${params}`);
    addLog('ok', `Estrategia ${key.toUpperCase()} → ${estState[key] ? 'ON' : 'OFF'}`);
  } catch(e) {
    addLog('err', 'Error actualizando estrategia');
  }
}

function actualizarEstCards() {
  const map = { vr1:'est-vr1', rpg:'est-rpg', gna:'est-gna', gba:'est-gba' };
  for (const [key, id] of Object.entries(map)) {
    const card = document.getElementById(id);
    const state = card.querySelector('.estrategia-state');
    card.className = 'estrategia-card ' + (estState[key] ? 'est-on' : 'est-off');
    state.textContent = estState[key] ? 'ON' : 'OFF';
  }
}

// ══════════════════════════════════════════
// LOG
// ══════════════════════════════════════════
function addLog(type, msg) {
  const log = document.getElementById('log');
  const now = new Date();
  const est = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const time = `${String(est.getHours()).padStart(2,'0')}:${String(est.getMinutes()).padStart(2,'0')}:${String(est.getSeconds()).padStart(2,'0')}`;
  const entry = document.createElement('div');
  entry.className = `log-entry log-${type}`;
  entry.innerHTML = `<span class="log-time">${time}</span>${msg}`;
  log.insertBefore(entry, log.firstChild);
  if (log.children.length > 50) log.removeChild(log.lastChild);
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  setTimeout(() => { t.className = ''; }, 3000);
}
</script>
